$kind: http-request
name: "[PRA] API dapat dijangkau & token valid (GET /api/penghuni = 200)"
url: "{{base_url}}/api/penghuni"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      pm.test('Status 200 - base_url benar & token diterima', () => pm.response.to.have.status(200));
      pm.test('data berupa array', () => pm.expect(res.data).to.be.an('array'));
    language: text/javascript
examples: .resources/[PRA] API dapat dijangkau & token valid (GET -api-penghuni = 200.resources/examples
order: 2000
