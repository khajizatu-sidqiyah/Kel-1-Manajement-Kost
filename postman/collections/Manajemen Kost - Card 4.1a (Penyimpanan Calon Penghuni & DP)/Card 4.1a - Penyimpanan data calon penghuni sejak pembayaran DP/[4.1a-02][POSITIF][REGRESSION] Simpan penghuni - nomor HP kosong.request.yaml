$kind: http-request
name: "[4.1a-02][POSITIF][REGRESSION] Simpan penghuni - nomor HP kosong -> tetap tersimpan"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": {{s_kamar}},
      "nama_penghuni": "Rina"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 201 - tanpa nomor HP tetap tersimpan', () => pm.response.to.have.status(201));
      pm.test('no_telepon tersimpan kosong', () => {
        const p = (res.data && res.data.penghuni) || res.data;
        pm.expect(p.no_telepon === null || p.no_telepon === undefined || p.no_telepon === '').to.be.true;
      });
    language: text/javascript
order: 2000
