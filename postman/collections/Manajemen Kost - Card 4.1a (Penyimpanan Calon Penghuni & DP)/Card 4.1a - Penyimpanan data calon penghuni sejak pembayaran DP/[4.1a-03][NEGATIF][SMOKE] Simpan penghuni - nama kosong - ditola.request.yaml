$kind: http-request
name: "[4.1a-03][NEGATIF][SMOKE] Simpan penghuni - nama kosong -> ditolak"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": {{s_kamar}},
      "no_telepon": "081234567890"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 422 - nama kosong ditolak', () => pm.response.to.have.status(422));
      pm.test('error.details menyebut nama_penghuni', () => pm.expect(JSON.stringify(res.error.details || {})).to.include('nama_penghuni'));
      pm.test('Tidak ada data tersimpan', () => pm.expect(res.data === undefined || res.data === null).to.be.true);
    language: text/javascript
order: 3000
