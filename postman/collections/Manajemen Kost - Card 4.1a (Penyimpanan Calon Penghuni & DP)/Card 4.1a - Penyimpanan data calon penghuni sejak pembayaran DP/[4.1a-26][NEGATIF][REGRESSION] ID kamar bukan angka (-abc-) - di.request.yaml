$kind: http-request
name: '[4.1a-26][NEGATIF][REGRESSION] ID kamar bukan angka ("abc") -> ditolak'
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": "abc",
      "nama_penghuni": "Rina",
      "alamat": "Kuningan"
    }
scripts:
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 422 - id_kamar non-angka ditolak', () => pm.response.to.have.status(422));
    language: text/javascript
order: 26000
