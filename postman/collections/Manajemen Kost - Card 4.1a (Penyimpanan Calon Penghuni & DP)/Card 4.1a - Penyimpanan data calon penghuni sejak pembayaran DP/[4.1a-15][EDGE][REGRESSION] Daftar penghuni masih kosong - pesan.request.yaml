$kind: http-request
name: '[4.1a-15][EDGE][REGRESSION] Daftar penghuni masih kosong -> pesan "Belum ada data penghuni" (kondisional)'
url: "{{base_url}}/api/penghuni"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('GET /penghuni');
      pm.test('Status 200 - daftar penghuni', () => pm.response.to.have.status(200));
      pm.test('Jika daftar kosong, pesan "Belum ada data penghuni" tampil (hanya bermakna di DB kosong)', () => {
        pm.expect(res.data).to.be.an('array');
        if (res.data.length === 0) pm.expect(res.message).to.include('Belum ada data penghuni');
      });
    language: text/javascript
order: 15000
