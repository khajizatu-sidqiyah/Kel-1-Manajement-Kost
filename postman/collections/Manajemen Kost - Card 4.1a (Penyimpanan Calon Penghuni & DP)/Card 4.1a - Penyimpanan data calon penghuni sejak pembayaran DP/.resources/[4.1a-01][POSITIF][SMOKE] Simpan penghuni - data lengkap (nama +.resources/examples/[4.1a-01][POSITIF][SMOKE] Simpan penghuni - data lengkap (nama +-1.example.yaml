$kind: http-example
name: "[4.1a-01][POSITIF][SMOKE] Simpan penghuni - data lengkap (nama + nomor HP) -> tersimpan"
request:
  url: "{{base_url}}/api/penghunian/dengan-penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "id_kamar": {{s_kamar}},
        "nama_penghuni": "Rina",
        "no_telepon": "081234567890"
      }
