$kind: http-request
name: "[4.1a-29][POSITIF][REGRESSION] Tanggal masuk diisi saat menyimpan -> tersimpan"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": {{s_kamar}},
      "nama_penghuni": "Rina",
      "alamat": "Kuningan",
      "tanggal_mulai": "2026-11-05"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 201 - tersimpan dengan tanggal masuk', () => pm.response.to.have.status(201));
      pm.test('tanggal_mulai = 5 November 2026', () => pm.expect(JSON.stringify(H(res.data).tanggal_mulai)).to.include('2026-11-05'));
    language: text/javascript
order: 29000
