$kind: http-request
name: "[4.1a-04][NEGATIF][SMOKE] Simpan penghuni - kamar tidak dipilih -> ditolak"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nama_penghuni": "Rina",
      "no_telepon": "081234567890"
    }
scripts:
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 422 - kamar kosong ditolak', () => pm.response.to.have.status(422));
      pm.test('error.details menyebut id_kamar', () => pm.expect(JSON.stringify(res.error.details || {})).to.include('id_kamar'));
    language: text/javascript
order: 4000
