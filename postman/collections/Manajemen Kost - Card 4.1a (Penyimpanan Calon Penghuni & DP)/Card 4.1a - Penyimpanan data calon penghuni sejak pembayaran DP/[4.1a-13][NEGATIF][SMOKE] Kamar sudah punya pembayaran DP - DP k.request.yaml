$kind: http-request
name: "[4.1a-13][NEGATIF][SMOKE] Kamar sudah punya pembayaran DP -> DP kedua ditolak (tombol tidak tampil)"
url: "{{base_url}}/api/penghunian/{{s_rina}}/dp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "tanggal_bayar": "2026-11-05",
      "jumlah": 300000,
      "metode_pembayaran": "transfer"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); }),
        n => mkOcc(getv('s_kamar'), 'Rina', {tanggal_mulai:'2026-11-05'}, r => { r = r || {}; setv('s_rina', r.penghunian); setv('s_rina_penghuni', r.penghuni); n(); }),
        n => hitung(getv('s_rina'), 'bulanan', () => n()),
        n => bayar(getv('s_rina'), 'dp', 300000, () => n()),
        n => api('GET', '/api/penghunian/' + getv('s_rina'), null, j => { const h = (j && j.data) || {}; setv('s_pay_count', (h.pembayaran || []).length); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/{id}/dp');
      pm.test('Status 422 - DP kedua ditolak', () => pm.response.to.have.status(422));
      pm.test('Pesan galat tampil', () => pm.expect(res.message).to.be.a('string').and.not.empty);
      apiGet('/api/penghunian/' + getv('s_rina'), (err, j) => {
        pm.test('Pembayaran TIDAK tersimpan (jumlah pembayaran tidak bertambah)', () => {
          pm.expect(((H(j.data).pembayaran) || []).length).to.eql(Number(getv('s_pay_count')));
        });
      });
    language: text/javascript
order: 13000
