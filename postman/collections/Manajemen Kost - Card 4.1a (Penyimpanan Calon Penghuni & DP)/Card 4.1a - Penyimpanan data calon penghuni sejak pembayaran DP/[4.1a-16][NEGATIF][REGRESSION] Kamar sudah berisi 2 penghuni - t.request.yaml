$kind: http-request
name: "[4.1a-16][NEGATIF][REGRESSION] Kamar sudah berisi 2 penghuni -> tidak bisa dipilih lagi"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": {{s_kamar}},
      "nama_penghuni": "Dewi",
      "alamat": "Kuningan"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); }),
        n => mkOcc(getv('s_kamar'), 'Rina', {}, r => { r = r || {}; setv('s_rina', r.penghunian); setv('s_rina_penghuni', r.penghuni); n(); }),
        n => mkOcc(getv('s_kamar'), 'Sari', {}, r => { r = r || {}; setv('s_sari', r.penghunian); setv('s_sari_penghuni', r.penghuni); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 422 - penghuni ke-3 ditolak', () => pm.response.to.have.status(422));
      pm.test('Penghuni ke-3 tidak tersimpan', () => pm.expect(res.data === undefined || res.data === null).to.be.true);
    language: text/javascript
order: 16000
