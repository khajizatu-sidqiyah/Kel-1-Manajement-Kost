$kind: http-request
name: "[4.1a-28][NEGATIF][REGRESSION] Tanggal selesai sebelum tanggal masuk -> ditolak"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": {{s_kamar}},
      "nama_penghuni": "Rina",
      "alamat": "Kuningan",
      "tanggal_mulai": "2026-11-05",
      "tanggal_selesai": "2026-11-01"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 422 - tanggal selesai < mulai ditolak', () => pm.response.to.have.status(422));
      pm.test('error.details menyebut tanggal_selesai', () => pm.expect(JSON.stringify(res.error.details || {})).to.include('tanggal_selesai'));
    language: text/javascript
order: 28000
