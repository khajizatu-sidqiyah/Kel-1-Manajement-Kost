$kind: http-request
name: "[4.1a-08][POSITIF][SMOKE] Setelah penghuni tersimpan, kamar tampil terisi di denah"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_kamar": {{s_kamar}},
      "nama_penghuni": "Rina",
      "alamat": "Kuningan"
    }
scripts:
  - type: beforeRequest
    code: |-
      const { api, uniq, setv, getv, seq, mkKamar, mkOcc, hitung, bayar, payId } = eval(pm.collectionVariables.get('lib'));
      seq([
        n => mkKamar({}, id => { setv('s_kamar', id); n(); })
      ]);
    language: text/javascript
  - type: afterResponse
    code: |-
      const { res, apiGet, getv, H, PB, swaggerCheck } = eval(pm.collectionVariables.get('lib'));
      swaggerCheck('POST /penghunian/dengan-penghuni');
      pm.test('Status 201 - penghuni tersimpan', () => pm.response.to.have.status(201));
      apiGet('/api/kamar/' + getv('s_kamar'), (err, j) => {
        pm.test('Status kamar menjadi terisi', () => pm.expect(j.data.status).to.eql('terisi'));
      });
    language: text/javascript
order: 8000
