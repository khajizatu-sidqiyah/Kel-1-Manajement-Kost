$kind: http-example
request:
  url: "{{base_url}}/pembayaran"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "id_penghunian": "",
        "jenis_pembayaran": "",
        "tanggal_bayar": "",
        "jumlah": "",
        "metode_pembayaran": ""
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Sat, 31 Oct 2026 04:48:57 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Parameter permintaan tidak valid.",
        "error": {
          "code": 422,
          "message": "Parameter permintaan tidak valid.",
          "status": "INVALID_ARGUMENT",
          "details": {}
        }
      }
order: 1000
