$kind: http-example
name: 01 Login pemilik - isi credential di environment
request:
  url: "{{base_url}}/login"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "pemilik@gmail.com",
        "password": "password123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Sat, 31 Oct 2026 04:27:00 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Login berhasil.",
        "data": {
          "token": "26|s0jAOTfqTT08BL8hQHiiWpBOuieNtvLROPXNU3cS66bd27b4",
          "token_type": "Bearer",
          "user": {
            "id": 1,
            "name": "Pemilik Kost",
            "email": "pemilik@gmail.com",
            "role": "pemilik"
          }
        }
      }
order: 2000
