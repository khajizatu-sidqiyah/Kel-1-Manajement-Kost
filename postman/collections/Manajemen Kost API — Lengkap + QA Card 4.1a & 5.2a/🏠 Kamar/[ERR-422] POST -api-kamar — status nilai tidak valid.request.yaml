$kind: http-request
name: "[ERR-422] POST /api/kamar — status nilai tidak valid"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": "B01",
      "harga": 500000,
      "status": "tidak_valid"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 422 — status harus kosong/terisi', () =>
      pm.response.to.have.status(422));


      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });

      pm.test('422 - error.details memuat field: status', () => {
        const details = JSON.stringify(res.error.details || {});
        ["status"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });

      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
order: 8000
