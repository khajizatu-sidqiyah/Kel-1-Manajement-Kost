$kind: http-request
name: "[OK] POST /api/penghunian/:id/hitung-dp — hitung DP bulanan"
url: "{{base_url}}/api/penghunian/{{penghunian_id}}/hitung-dp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "skema_sewa": "bulanan"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 200', () => pm.response.to.have.status(200));

      pm.test('Memiliki dp_minimum', () => {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('dp_minimum');
      });


      pm.test('skema_sewa = bulanan, dp_minimum = 50% total_sewa', () => {
        const d = res.data;
        pm.expect(d.skema_sewa).to.eql('bulanan');
        pm.expect(Number(d.total_sewa)).to.be.above(0);
        pm.expect(Number(d.dp_minimum)).to.eql(Number(d.total_sewa) * 0.5);
      });

      pm.test('tenggat bulanan = tanggal_mulai (2026-11-05 dari request #59)',
      () => {
        pm.expect(JSON.stringify(res.data.tenggat_pelunasan)).to.include('2026-11-05');
      });
    language: text/javascript
order: 15000
