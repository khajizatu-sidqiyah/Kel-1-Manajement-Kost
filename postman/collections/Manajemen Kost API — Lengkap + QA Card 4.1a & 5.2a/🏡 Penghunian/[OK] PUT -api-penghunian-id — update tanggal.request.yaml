$kind: http-request
name: "[OK] PUT /api/penghunian/:id — update tanggal"
url: "{{base_url}}/api/penghunian/{{penghunian_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tanggal_mulai": "2026-11-05",
      "tanggal_selesai": "2026-12-05"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200', () => pm.response.to.have.status(200));

      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });
      pm.test('Tanggal penghunian berubah sesuai payload', () => {
        const d = (res.data && res.data.penghunian) || res.data;
        pm.expect(JSON.stringify(d.tanggal_mulai)).to.include('2026-11-05');
        pm.expect(JSON.stringify(d.tanggal_selesai)).to.include('2026-12-05');
      });
    language: text/javascript
order: 11000
