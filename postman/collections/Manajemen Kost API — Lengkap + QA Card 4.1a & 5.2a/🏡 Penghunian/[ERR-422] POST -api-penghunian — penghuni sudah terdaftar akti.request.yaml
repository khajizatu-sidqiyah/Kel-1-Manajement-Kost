$kind: http-request
name: "[ERR-422] POST /api/penghunian — penghuni sudah terdaftar aktif di kamar
  yang sama"
url: "{{base_url}}/api/penghunian"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": {{kamar_id}},
      "id_penghuni": {{penghuni_id}},
      "tanggal_mulai": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 422 — TENANT_ALREADY_REGISTERED', () => {
        pm.expect(pm.response.code).to.eql(422);
        pm.expect(pm.response.json().error.code).to.eql('TENANT_ALREADY_REGISTERED');
      });


      pm.test('422 - error.code berformat KODE_BISNIS', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.code).to.match(/^[A-Z_]+$/);
      });
    language: text/javascript
order: 4000
