$kind: http-request
name: "[ERR-422] PUT /api/penghunian/:id — tanggal_selesai sebelum tanggal_mulai"
url: "{{base_url}}/api/penghunian/{{penghunian_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tanggal_mulai": "2026-12-01",
      "tanggal_selesai": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 422', () => pm.response.to.have.status(422));


      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });

      pm.test('422 - error.details memuat field: tanggal_selesai', () => {
        const details = JSON.stringify(res.error.details || {});
        ["tanggal_selesai"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });

      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
order: 12000
