$kind: http-request
name: "[OK] POST /api/penghunian — penghunian untuk penghuni existing"
url: "{{base_url}}/api/penghunian"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": {{kamar_id}},
      "id_penghuni": {{penghuni_id}},
      "tanggal_mulai": "2026-11-01",
      "tanggal_selesai": "2026-11-30"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 201', () => pm.response.to.have.status(201));

      pm.test('id_penghunian tersimpan', () => {
        const json = pm.response.json();
        if (json.data && json.data.id_penghunian) {
          pm.collectionVariables.set('penghunian_id', json.data.id_penghunian);
        }
      });


      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });

      pm.test('Penghunian tersimpan untuk kamar & penghuni yang benar', () => {
        const d = res.data;
        pm.expect(d.id_penghunian).to.be.a('number');
        pm.expect(String(d.id_kamar)).to.eql(String(pm.collectionVariables.get('kamar_id')));
        pm.expect(String(d.id_penghuni)).to.eql(String(pm.collectionVariables.get('penghuni_id')));
        pm.expect(JSON.stringify(d.tanggal_mulai)).to.include('2026-11-01');
      });

      pm.test('Status awal penghunian = aktif (jika field status dikirim)', ()
      => {
        if (res.data.status !== undefined) pm.expect(res.data.status).to.eql('aktif');
      });

      pm.test('penghunian_id tersimpan di collection variable', () => {
        pm.expect(String(pm.collectionVariables.get('penghunian_id'))).to.eql(String(res.data.id_penghunian));
      });
    language: text/javascript
order: 2000
