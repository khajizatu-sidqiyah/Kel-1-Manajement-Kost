$kind: http-request
name: "[OK] PUT /api/penghunian/:id/penyewa-utama — set penyewa utama"
url: "{{base_url}}/api/penghunian/{{penghunian_id}}/penyewa-utama"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": {{kamar_id}}
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 200', () => pm.response.to.have.status(200));


      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });

      pm.test('penyewa_utama = true', () =>
      pm.expect(res.data.penyewa_utama).to.be.oneOf([true, 1]));
    language: text/javascript
order: 13000
