$kind: http-request
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nama_penghuni": "Penghuni Tanpa Kamar",
      "no_telepon": "081234567890",
      "alamat": "Jl. Uji"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {}; try { res = pm.response.json(); } catch (e) {}

      pm.test('Status 422 — validasi menolak input', () =>
      pm.response.to.have.status(422));

      pm.test('Respons JSON dan memuat error', () => {
      pm.expect(pm.response.headers.get('Content-Type') ||
      '').to.include('application/json'); pm.expect(res.error || res.errors ||
      res.message).to.exist; });

      pm.test('Tidak ada data tersimpan pada respons gagal', () =>
      pm.expect(res.data === undefined || res.data === null).to.be.true);

      pm.test('Error mengarah ke id_kamar', () =>
      pm.expect(JSON.stringify(res.error || res.errors ||
      res)).to.include('id_kamar'));
    language: text/javascript
examples: .resources/[4.1a][NEG] Simpan tanpa memilih kamar.resources/examples
order: 3000
