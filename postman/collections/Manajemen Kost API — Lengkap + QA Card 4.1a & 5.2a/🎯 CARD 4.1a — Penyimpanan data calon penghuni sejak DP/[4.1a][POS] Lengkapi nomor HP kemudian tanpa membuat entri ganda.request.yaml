$kind: http-request
url: "{{base_url}}/api/penghuni/{{qa41a_penghuni_utama_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_telepon": "081298765432"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {}; try { res = pm.response.json(); } catch(e) {}
      pm.test('Status 200 — data penghuni diperbarui', () => pm.response.to.have.status(200));
      pm.test('Nomor HP tersimpan sesuai input', () => pm.expect(res.data.no_telepon).to.eql('081298765432'));
      pm.test('ID penghuni tetap sama', () => pm.expect(String(res.data.id_penghuni)).to.eql(String(pm.collectionVariables.get('qa41a_penghuni_utama_id'))));
    language: text/javascript
examples: .resources/[4.1a][POS] Lengkapi nomor HP kemudian tanpa membuat entri
  ganda.resources/examples
order: 6000
