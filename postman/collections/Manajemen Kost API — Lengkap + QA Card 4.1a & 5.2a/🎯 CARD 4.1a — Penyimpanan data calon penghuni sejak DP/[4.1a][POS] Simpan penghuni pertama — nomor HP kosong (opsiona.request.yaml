$kind: http-request
name: "[4.1a][POS] Simpan penghuni pertama — nomor HP kosong (opsional)"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": "{{kamar_id}}",
      "nama_penghuni": "Rina",
      "alamat": "Kuningan"
    }
auth:
  type: bearer
  credentials:
    token: "{{auth_secret_12t8}}"
scripts:
  - type: afterResponse
    code: |-
      let res = {}; try { res = pm.response.json(); } catch(e) {}
      pm.test('Status 201 — penghuni dan penghunian dibuat', () => pm.response.to.have.status(201));
      pm.test('Relasi penghuni-penghunian terbentuk', () => { pm.expect(res.data).to.have.property('penghuni'); pm.expect(res.data).to.have.property('penghunian'); pm.expect(String(res.data.penghunian.id_penghuni)).to.eql(String(res.data.penghuni.id_penghuni)); });
      pm.test('Nomor HP boleh kosong/null', () => pm.expect([undefined,null,'']).to.include(res.data.penghuni.no_telepon));
      pm.test('Tanggal masuk belum diisi saat awal tersimpan', () => pm.expect([undefined,null,'']).to.include(res.data.penghunian.tanggal_mulai));
      pm.test('ID uji tersimpan untuk skenario lanjutan', () => { pm.collectionVariables.set('qa41a_penghuni_utama_id',res.data.penghuni.id_penghuni); pm.collectionVariables.set('qa41a_penghunian_utama_id',res.data.penghunian.id_penghunian); });
      pm.test('Penghuni pertama menjadi penyewa utama', () => pm.expect([true,1,'1']).to.include(res.data.penghunian.is_penyewa_utama));
    language: text/javascript
examples: .resources/[4.1a][POS] Simpan penghuni pertama — nomor HP kosong
  (opsiona.resources/examples
order: 1000
