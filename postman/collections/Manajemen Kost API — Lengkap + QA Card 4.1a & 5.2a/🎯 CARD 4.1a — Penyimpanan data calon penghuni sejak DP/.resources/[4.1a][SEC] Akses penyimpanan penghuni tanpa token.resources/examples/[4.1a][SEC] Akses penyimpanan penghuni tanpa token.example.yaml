$kind: http-example
request:
  url: "{{base_url}}/api/penghunian/dengan-penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "id_kamar": "{{kamar_id}}",
        "nama_penghuni": "Akses Tanpa Token"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 15:55:13 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Autentikasi diperlukan.",
        "error": {
          "code": 401,
          "message": "Token tidak ada atau tidak valid.",
          "status": "UNAUTHENTICATED",
          "details": {}
        }
      }
order: 1000
