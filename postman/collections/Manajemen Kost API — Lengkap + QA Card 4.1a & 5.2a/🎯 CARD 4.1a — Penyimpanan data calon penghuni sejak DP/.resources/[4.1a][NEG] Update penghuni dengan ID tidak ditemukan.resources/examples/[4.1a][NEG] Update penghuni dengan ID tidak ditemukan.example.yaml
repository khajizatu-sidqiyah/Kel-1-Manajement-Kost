$kind: http-example
request:
  url: "{{base_url}}/api/penghuni/99999999"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "no_telepon": "081234567890"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 15:57:59 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data penghuni tidak ditemukan.",
        "error": {
          "code": 404,
          "message": "Penghuni dengan ID 99999999 tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": []
        }
      }
order: 1000
