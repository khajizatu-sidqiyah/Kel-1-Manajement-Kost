$kind: http-request
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_kamar": "{{kamar_id}}",
      "nama_penghuni": "Akses Tanpa Token"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401 — wajib login', () => pm.response.to.have.status(401));
    language: text/javascript
examples: .resources/[4.1a][SEC] Akses penyimpanan penghuni tanpa
  token.resources/examples
order: 12000
