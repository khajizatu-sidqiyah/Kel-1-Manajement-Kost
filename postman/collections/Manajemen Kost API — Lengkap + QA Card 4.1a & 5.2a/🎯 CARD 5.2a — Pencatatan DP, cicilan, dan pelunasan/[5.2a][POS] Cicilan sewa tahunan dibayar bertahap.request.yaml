$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "",
      "jenis_pembayaran": "cicilan",
      "tanggal_bayar": "2026-11-10",
      "jumlah": 2000000,
      "metode_pembayaran": "Transfer Bank"
    }
scripts:
  - type: beforeRequest
    code: |-
      const BASE=pm.variables.replaceIn('{{base_url}}');
      function api(method,path,body,cb){pm.sendRequest({url:BASE+path,method,header:{'Accept':'application/json','Content-Type':'application/json','Authorization':'Bearer '+pm.collectionVariables.get('token')},body:body?{mode:'raw',raw:JSON.stringify(body)}:undefined},(err,r)=>{let j=null;try{j=r.json()}catch(e){}cb(err?null:j,r);});}
      const u=String(Date.now()).slice(-8);
      api('POST','/api/kamar',{no_kamar:'Y'+u,harga:1000000,harga_tahunan:10000000},(k)=>{
       if(!k?.data?.id_kamar){console.error('Setup kamar tahunan gagal');return;}
       api('POST','/api/penghunian/dengan-penghuni',{id_kamar:k.data.id_kamar,nama_penghuni:'QA Tahunan '+u,no_telepon:'0813'+u,alamat:'Jl. Uji',tanggal_mulai:'2026-11-04'},(h)=>{
        if(!h?.data?.penghunian){console.error('Setup penghuni tahunan gagal');return;}
        const id=h.data.penghunian.id_penghunian; pm.collectionVariables.set('qa52_tahunan_id',id);
        api('POST','/api/penghunian/'+id+'/hitung-dp',{skema_sewa:'tahunan'},(c,cr)=>{
         if(!c?.data?.dp_minimum){console.error('Skema tahunan belum tersedia',cr?.code);return;}
         const dp=Number(c.data.dp_minimum);
         api('POST','/api/pembayaran',{id_penghunian:id,jenis_pembayaran:'dp',tanggal_bayar:'2026-11-04',jumlah:dp,metode_pembayaran:'Transfer Bank'},(saved,sr)=>{
          if(!saved?.data?.sisa_tagihan){console.error('DP awal tahunan gagal',sr?.code);return;}
          pm.collectionVariables.set('qa52_tahunan_sisa_awal',Number(saved.data.sisa_tagihan));
          const b=JSON.parse(pm.variables.replaceIn(pm.request.body.raw)); b.id_penghunian=id; pm.request.body.update(JSON.stringify(b,null,2));
         });
        });
       });
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      let res={}; try {res=pm.response.json();} catch(e) {}
      pm.test('Status 201 — cicilan tahunan tercatat',()=>pm.response.to.have.status(201));
      pm.test('Jenis pembayaran cicilan',()=>pm.expect(res.data.pembayaran.jenis_pembayaran).to.eql('cicilan'));
      pm.test('Sisa tagihan berkurang sesuai nominal cicilan',()=>pm.expect(Number(res.data.sisa_tagihan)).to.eql(Number(pm.collectionVariables.get('qa52_tahunan_sisa_awal'))-Number(res.data.pembayaran.jumlah)));
      pm.test('Status tetap belum lunas setelah pembayaran sebagian',()=>pm.expect(res.data.status_pembayaran).to.eql('belum_lunas'));
    language: text/javascript
order: 22000
