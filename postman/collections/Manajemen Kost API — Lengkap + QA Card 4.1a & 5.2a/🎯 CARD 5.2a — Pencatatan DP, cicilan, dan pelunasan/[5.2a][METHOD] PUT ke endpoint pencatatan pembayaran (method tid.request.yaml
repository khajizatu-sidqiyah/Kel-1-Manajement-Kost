$kind: http-request
name: "[5.2a][METHOD] PUT ke endpoint pencatatan pembayaran (method tidak sesuai)"
url: "{{base_url}}/api/pembayaran"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_id}}",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-04",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status 405 Method Not Allowed', () =>
      pm.response.to.have.status(405));

      pm.test('Respons tidak berupa 5xx', () =>
      pm.expect(pm.response.code).to.be.below(500));
    language: text/javascript
order: 19000
