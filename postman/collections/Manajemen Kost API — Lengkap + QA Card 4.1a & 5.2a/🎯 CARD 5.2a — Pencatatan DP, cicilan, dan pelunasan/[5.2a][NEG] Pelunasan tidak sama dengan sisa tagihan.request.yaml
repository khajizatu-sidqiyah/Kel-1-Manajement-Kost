$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_id}}",
      "jenis_pembayaran": "pelunasan",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 1,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {}; try { res = pm.response.json(); } catch(e) {}

      pm.test('Status 422 — nominal pelunasan harus sama dengan sisa', () =>
      pm.response.to.have.status(422));

      pm.test('Kode bisnis INVALID_FINAL_PAYMENT_AMOUNT', () =>
      pm.expect(res.error.code).to.eql('INVALID_FINAL_PAYMENT_AMOUNT'));
    language: text/javascript
examples: .resources/[5.2a][NEG] Pelunasan tidak sama dengan sisa
  tagihan.resources/examples
order: 12000
