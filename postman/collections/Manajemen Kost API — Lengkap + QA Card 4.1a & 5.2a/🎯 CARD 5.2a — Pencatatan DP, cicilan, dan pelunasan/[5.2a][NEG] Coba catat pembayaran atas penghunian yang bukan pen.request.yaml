$kind: http-request
name: "[5.2a][NEG] Coba catat pembayaran atas penghunian yang bukan penyewa utama"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{qa41a_penghunian_utama_id}}",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-04",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: |-
      let res={}; try {res=pm.response.json();} catch(e) {}
      pm.test('Pembayaran bukan dicatat atas penghuni non-utama',()=>pm.expect(pm.response.code).to.be.oneOf([400,403,422]));
      pm.test('Tidak ada pembayaran tercatat untuk penghuni non-utama',()=>pm.expect(res.data===undefined||res.data===null).to.be.true);
    language: text/javascript
order: 24000
