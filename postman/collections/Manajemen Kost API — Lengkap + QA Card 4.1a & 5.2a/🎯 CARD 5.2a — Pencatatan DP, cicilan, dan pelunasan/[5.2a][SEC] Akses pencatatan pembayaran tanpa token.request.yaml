$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_id}}",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-04",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401 — pembayaran wajib memakai token pemilik', () =>
      pm.response.to.have.status(401));
    language: text/javascript
order: 20000
