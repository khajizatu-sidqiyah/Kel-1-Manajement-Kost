$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_baru_id}}",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-04",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {}; try { res = pm.response.json(); } catch(e) {}

      pm.test('Status 422 — skema wajib dipilih sebelum pembayaran', () =>
      pm.response.to.have.status(422));

      pm.test('Kode bisnis RENT_SCHEME_NOT_SELECTED', () =>
      pm.expect(res.error.code).to.eql('RENT_SCHEME_NOT_SELECTED'));
    language: text/javascript
order: 13000
