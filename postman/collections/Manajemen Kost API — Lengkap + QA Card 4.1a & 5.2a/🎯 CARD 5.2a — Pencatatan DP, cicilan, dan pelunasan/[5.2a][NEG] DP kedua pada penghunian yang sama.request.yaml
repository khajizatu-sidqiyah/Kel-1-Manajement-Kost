$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_id}}",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {}; try { res = pm.response.json(); } catch(e) {}

      pm.test('Status 422 — DP hanya boleh dicatat sekali', () =>
      pm.response.to.have.status(422));

      pm.test('Kode bisnis DP_ALREADY_EXISTS', () =>
      pm.expect(res.error.code).to.eql('DP_ALREADY_EXISTS'));
    language: text/javascript
examples: .resources/[5.2a][NEG] DP kedua pada penghunian yang sama.resources/examples
order: 9000
