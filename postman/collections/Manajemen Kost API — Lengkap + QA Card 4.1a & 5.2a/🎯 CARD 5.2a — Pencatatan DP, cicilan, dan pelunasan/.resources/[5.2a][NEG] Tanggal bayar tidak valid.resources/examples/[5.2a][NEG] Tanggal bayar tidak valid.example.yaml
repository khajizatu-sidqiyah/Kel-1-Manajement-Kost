$kind: http-example
request:
  url: "{{base_url}}/api/pembayaran"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_penghunian": "{{penghunian_id}}",
        "jenis_pembayaran": "cicilan",
        "tanggal_bayar": "31-99-2026",
        "jumlah": 100000,
        "metode_pembayaran": "Cash"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 16:17:57 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Parameter permintaan tidak valid.",
        "error": {
          "code": 422,
          "message": "Validasi gagal.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "tanggal_bayar": [
              "The tanggal bayar field must be a valid date."
            ]
          }
        }
      }
order: 1000
