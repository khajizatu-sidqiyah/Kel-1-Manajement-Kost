$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_id}}",
      "jenis_pembayaran": "pelunasan",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 999999999,
      "metode_pembayaran": "Transfer Bank"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {}; try { res = pm.response.json(); } catch(e) {}

      pm.test('Status 422 — nominal tidak boleh melebihi sisa', () =>
      pm.response.to.have.status(422));

      pm.test('Kode bisnis PAYMENT_EXCEEDS_REMAINING', () =>
      pm.expect(res.error.code).to.eql('PAYMENT_EXCEEDS_REMAINING'));
    language: text/javascript
examples: .resources/[5.2a][NEG] Nominal melebihi sisa tagihan.resources/examples
order: 11000
