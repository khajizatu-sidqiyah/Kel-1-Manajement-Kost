$kind: http-request
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": "{{penghunian_id}}",
      "jenis_pembayaran": "cicilan",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 200000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {}; try { res = pm.response.json(); } catch(e) {}

      pm.test('Status 422 — cicilan tidak sesuai skema bulanan', () =>
      pm.response.to.have.status(422));

      pm.test('Kode bisnis INSTALLMENT_NOT_ALLOWED', () =>
      pm.expect(res.error.code).to.eql('INSTALLMENT_NOT_ALLOWED'));
    language: text/javascript
examples: .resources/[5.2a][NEG] Cicilan pada skema bulanan.resources/examples
order: 10000
