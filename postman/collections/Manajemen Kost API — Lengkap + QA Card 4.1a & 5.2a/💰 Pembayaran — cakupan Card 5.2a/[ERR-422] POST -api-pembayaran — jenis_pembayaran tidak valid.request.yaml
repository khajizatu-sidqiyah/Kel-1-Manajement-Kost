$kind: http-request
name: "[ERR-422] POST /api/pembayaran — jenis_pembayaran tidak valid"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": {{penghunian_id}},
      "jenis_pembayaran": "uang_muka",
      "tanggal_bayar": "2026-11-01",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 422', () => pm.response.to.have.status(422));


      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });

      pm.test('422 - error.details memuat field: jenis_pembayaran', () => {
        const details = JSON.stringify(res.error.details || {});
        ["jenis_pembayaran"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });

      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
order: 3000
