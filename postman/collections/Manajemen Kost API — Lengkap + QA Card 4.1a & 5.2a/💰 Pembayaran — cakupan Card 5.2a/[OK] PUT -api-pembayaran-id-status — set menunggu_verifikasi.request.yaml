$kind: http-request
name: "[OK] PUT /api/pembayaran/:id/status — set menunggu_verifikasi"
url: "{{base_url}}/api/pembayaran/{{pembayaran_id}}/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "status": "menunggu_verifikasi"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200', () => pm.response.to.have.status(200));

      pm.test('Status pembayaran = menunggu_verifikasi', () => {
        pm.expect(res.data.pembayaran.status).to.eql('menunggu_verifikasi');
      });
      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });
    language: text/javascript
order: 22000
