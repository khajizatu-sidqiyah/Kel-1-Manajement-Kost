$kind: http-request
name: "[ERR-422] POST /api/pembayaran — DP sudah pernah dicatat (duplikat DP)"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": {{penghunian_id}},
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-03",
      "jumlah": 500000,
      "metode_pembayaran": "Transfer Bank"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 422 — DP_ALREADY_EXISTS', () => {
        pm.expect(pm.response.code).to.eql(422);
        pm.expect(pm.response.json().error.code).to.eql('DP_ALREADY_EXISTS');
      });

      pm.test('422 - error.code berformat KODE_BISNIS', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.code).to.match(/^[A-Z_]+$/);
      });
      pm.test('422 - error.code = DP_ALREADY_EXISTS', () => {
        pm.expect(res.error.code).to.eql('DP_ALREADY_EXISTS');
      });
    language: text/javascript
order: 6000
