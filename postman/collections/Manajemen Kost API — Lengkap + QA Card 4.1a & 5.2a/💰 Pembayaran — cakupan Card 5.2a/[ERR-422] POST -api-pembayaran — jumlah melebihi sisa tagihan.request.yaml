$kind: http-request
name: "[ERR-422] POST /api/pembayaran — jumlah melebihi sisa tagihan"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": {{penghunian_id}},
      "jenis_pembayaran": "pelunasan",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 999999999,
      "metode_pembayaran": "Transfer Bank"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 422 — PAYMENT_EXCEEDS_REMAINING', () => {
        pm.expect(pm.response.code).to.eql(422);
      });

      pm.test('422 - error.code berformat KODE_BISNIS', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.code).to.match(/^[A-Z_]+$/);
      });
      pm.test('422 - error.code = PAYMENT_EXCEEDS_REMAINING', () => {
        pm.expect(res.error.code).to.eql('PAYMENT_EXCEEDS_REMAINING');
      });
    language: text/javascript
order: 9000
