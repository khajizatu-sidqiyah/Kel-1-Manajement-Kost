$kind: http-request
name: "[OK] POST /api/pembayaran — catat pembayaran DP"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": {{penghunian_id}},
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-01",
      "jumlah": 500000,
      "metode_pembayaran": "Transfer Bank",
      "bukti_pembayaran": "https://drive.google.com/bukti.jpg"
    }
scripts:
  - type: beforeRequest
    code: >-
      const BASE = pm.variables.replaceIn('{{base_url}}');

      function api(method, path, body, cb) {
        pm.sendRequest({
          url: BASE + path, method: method,
          header: { 'Accept': 'application/json', 'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + pm.collectionVariables.get('token') },
          body: body ? { mode: 'raw', raw: JSON.stringify(body) } : undefined
        }, (err, resp) => {
          if (err) { console.error(method + ' ' + path, err); cb(null, null); return; }
          let j = null; try { j = resp.json(); } catch (e) {}
          cb(j, resp);
        });
      }

      // Buat kamar + penghuni + penghunian baru (opsional langsung pilih
      skema). Hasil -> {{penghunian_baru_id}}

      function newOccupancy(scheme, cb) {
        const uniq = String(Date.now()).slice(-9);
        api('POST', '/api/kamar', { no_kamar: 'T' + uniq, harga: 1000000, harga_tahunan: 10000000 }, (k) => {
          if (!k || !k.data) { cb(null); return; }
          api('POST', '/api/penghunian/dengan-penghuni', {
            id_kamar: k.data.id_kamar, nama_penghuni: 'Penghuni Uji ' + uniq,
            no_telepon: '0813' + uniq.slice(-7), alamat: 'Jl. Uji', tanggal_mulai: '2026-11-01'
          }, (p) => {
            if (!p || !p.data) { cb(null); return; }
            const id = p.data.penghunian.id_penghunian;
            pm.collectionVariables.set('penghunian_baru_id', id);
            if (!scheme) { cb(id); return; }
            api('POST', '/api/penghunian/' + id + '/hitung-dp', { skema_sewa: scheme }, () => cb(id));
          });
        });
      }


      // hitung DP bulanan, lalu kirim DP sebesar dp_minimum (supaya tidak
      ditolak DP_BELOW_MINIMUM)

      api('POST', '/api/penghunian/' +
      pm.collectionVariables.get('penghunian_id') + '/hitung-dp', { skema_sewa:
      'bulanan' }, (j) => {
        const body = JSON.parse(pm.variables.replaceIn(pm.request.body.raw));
        if (j && j.data) body.jumlah = Number(j.data.dp_minimum);
        pm.request.body.update(JSON.stringify(body, null, 2));
      });
    language: text/javascript
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 201 - DP sebesar dp_minimum dicatat', () =>
      pm.response.to.have.status(201));

      if (pm.response.code === 201) pm.collectionVariables.set('pembayaran_id',
      res.data.pembayaran.id_pembayaran);


      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });

      pm.test('DP tercatat langsung terverifikasi & sisa tagihan benar', () => {
        const d = res.data, p = d.pembayaran;
        pm.expect(p.id_pembayaran).to.be.a('number');
        pm.expect(p.jenis_pembayaran).to.eql('dp');
        pm.expect(p.status).to.eql('terverifikasi');
        pm.expect(d.status_pembayaran).to.eql('belum_lunas');
        pm.expect(Number(d.sisa_tagihan)).to.eql(Number(d.total_sewa) - Number(p.jumlah));
        pm.expect(Number(d.total_terbayar)).to.eql(Number(p.jumlah));
      });

      pm.test('pembayaran_id tersimpan di collection variable', () => {
        pm.expect(String(pm.collectionVariables.get('pembayaran_id'))).to.eql(String(res.data.pembayaran.id_pembayaran));
      });
    language: text/javascript
order: 2000
