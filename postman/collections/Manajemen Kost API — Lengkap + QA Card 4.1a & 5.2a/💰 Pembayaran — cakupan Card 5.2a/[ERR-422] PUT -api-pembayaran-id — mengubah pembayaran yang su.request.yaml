$kind: http-request
name: "[ERR-422] PUT /api/pembayaran/:id — mengubah pembayaran yang sudah
  terverifikasi"
url: "{{base_url}}/api/pembayaran/{{pembayaran_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "jumlah": 999999
    }
scripts:
  - type: beforeRequest
    code: >-
      // Pastikan pembayaran berstatus terverifikasi dulu, supaya skenario "ubah
      pembayaran terverifikasi" valid

      pm.sendRequest({
        url: pm.variables.replaceIn('{{base_url}}') + '/api/pembayaran/' + pm.collectionVariables.get('pembayaran_id') + '/status',
        method: 'PUT',
        header: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + pm.collectionVariables.get('token')
        },
        body: { mode: 'raw', raw: JSON.stringify({ status: 'terverifikasi' }) }
      }, (err, resp) => { if (err) console.error('Gagal memverifikasi
      pembayaran:', err); });
    language: text/javascript
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 422 — PAYMENT_ALREADY_VERIFIED', () => {
        pm.expect(pm.response.code).to.eql(422);
        pm.expect(pm.response.json().error.code).to.eql('PAYMENT_ALREADY_VERIFIED');
      });


      pm.test('422 - error.code berformat KODE_BISNIS', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.code).to.match(/^[A-Z_]+$/);
      });

      pm.test('422 - error.code = PAYMENT_ALREADY_VERIFIED', () => {
        pm.expect(res.error.code).to.eql('PAYMENT_ALREADY_VERIFIED');
      });
    language: text/javascript
order: 17000
