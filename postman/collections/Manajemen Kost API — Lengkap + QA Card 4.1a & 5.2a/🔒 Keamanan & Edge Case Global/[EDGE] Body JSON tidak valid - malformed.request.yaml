$kind: http-request
name: "[EDGE] Body JSON tidak valid / malformed"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: "{ no_kamar: 'A01', harga: 500000 }"
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 400/422 — malformed JSON harus ditolak (500 = bug)', () =>
      {
        pm.expect([400, 422]).to.include(pm.response.code);
      });


      pm.test('Pesan error tidak membocorkan detail parser internal', () => {
        pm.expect(pm.response.text()).to.not.match(/Syntax error|JsonException|Symfony|\/vendor\//i);
      });
    language: text/javascript
order: 14000
