$kind: http-request
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: >-
    {
      "no_kamar": "A01",
      "harga": 500000,
      "data_ekstra": ""
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Server tidak crash — status bukan 500', () => {
        pm.expect(pm.response.code).to.not.eql(500);
      });


      pm.test('Body besar: ditolak atau divalidasi (201/413/422), tidak crash',
      () => {
        pm.expect([201, 413, 422]).to.include(pm.response.code);
      });
    language: text/javascript
order: 3000
