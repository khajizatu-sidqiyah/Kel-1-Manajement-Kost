$kind: http-request
name: "[SEC] Akses endpoint tanpa header Accept: application/json"
url: "{{base_url}}/api/kamar"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Tidak crash — server merespons', () => {
        pm.expect(pm.response.code).to.be.within(200, 500);
      });


      pm.test('Tanpa header Accept tetap 200 & body JSON (bukan redirect/HTML)',
      () => {
        pm.expect(pm.response.code).to.eql(200);
        pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json');
      });
    language: text/javascript
order: 1000
