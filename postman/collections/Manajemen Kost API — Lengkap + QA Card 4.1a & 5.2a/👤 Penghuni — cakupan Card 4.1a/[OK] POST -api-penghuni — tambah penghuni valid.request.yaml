$kind: http-request
name: "[OK] POST /api/penghuni — tambah penghuni valid"
url: "{{base_url}}/api/penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nama_penghuni": "Budi Santoso",
      "no_telepon": "081234567890",
      "email": "budi@example.com",
      "alamat": "Jl. Merdeka No. 1"
    }
scripts:
  - type: afterResponse
    code: >-
      let res = {};

      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }


      pm.test('Status 201', () => pm.response.to.have.status(201));

      pm.test('id_penghuni tersimpan', () => {
        const json = pm.response.json();
        pm.expect(json.data).to.have.property('id_penghuni');
        pm.collectionVariables.set('penghuni_id', json.data.id_penghuni);
      });


      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });

      pm.test('Data penghuni tersimpan sesuai payload', () => {
        const d = res.data;
        pm.expect(d.id_penghuni).to.be.a('number');
        pm.expect(d.nama_penghuni).to.eql('Budi Santoso');
        pm.expect(d.no_telepon).to.eql('081234567890');
        pm.expect(d.email).to.eql('budi@example.com');
        pm.expect(d.alamat).to.eql('Jl. Merdeka No. 1');
      });

      pm.test('penghuni_id tersimpan di collection variable', () => {
        pm.expect(String(pm.collectionVariables.get('penghuni_id'))).to.eql(String(res.data.id_penghuni));
      });
    language: text/javascript
order: 2000
