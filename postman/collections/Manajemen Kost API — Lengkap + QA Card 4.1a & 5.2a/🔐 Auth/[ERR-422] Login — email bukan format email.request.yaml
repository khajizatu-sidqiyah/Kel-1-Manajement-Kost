$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "bukan-email",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('error.status = INVALID_ARGUMENT', () => {
        pm.expect(pm.response.json().error.status).to.eql('INVALID_ARGUMENT');
      });

      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });
      pm.test('422 - error.details memuat field: email', () => {
        const details = JSON.stringify(res.error.details || {});
        ["email"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });
      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
order: 3000
