$kind: http-request
url: "{{base_url}}/penghuni/15"
method: DELETE
headers:
  Accept: application/json
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code 200 OK\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Content-Type JSON\", function () {\r

      \    pm.response.to.have.header(\"Content-Type\");\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      pm.test(\"Waktu response < 2 detik\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.test(\"Response berupa array/objek dan tidak kosong\", function () {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data).to.be.an(Array.isArray(data) ? \"array\" : \"object\");\r

      \    if (Array.isArray(data)) {\r

      \        pm.expect(data.length).to.be.above(0);\r

      \    }\r

      });\r

      \r

      pm.test(\"Struktur data penghuni valid\", function () {\r

      \    const data = pm.response.json();\r

      \    const item = Array.isArray(data) ? data[0] : data;\r

      \    pm.expect(item).to.have.property(\"id\");\r

      \    pm.expect(item).to.have.property(\"nama\");\r

      });\r

      \r

      pm.test(\"Status 201 Created (atau 200)\", function () {\r

      \    pm.expect([200, 201]).to.include(pm.response.code);\r

      });\r

      \r

      pm.test(\"Content-Type JSON\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      pm.test(\"Waktu response < 2 detik\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      const res = pm.response.json();\r

      \r

      pm.test(\"Response memuat id data baru\", function () {\r

      \    pm.expect(res).to.have.property(\"id\");\r

      \    pm.collectionVariables.set(\"penghuni_id\", res.id); // dipakai di PUT\r

      });\r

      \r

      pm.test(\"Data di response sesuai request\", function () {\r

      \    const req = JSON.parse(pm.request.body.raw);\r

      \    pm.expect(res.nama).to.eql(req.nama);\r

      });\r

      \r

      pm.test(\"Status 200 atau 204\", function () {\r

      \    pm.expect([200, 204]).to.include(pm.response.code);\r

      });\r

      \r

      pm.test(\"Waktu response < 2 detik\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      if (pm.response.code === 200) {\r

      \    pm.test(\"Content-Type JSON\", function () {\r

      \        pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      \    });\r

      \r

      \    pm.test(\"Data berubah sesuai request\", function () {\r

      \        const req = JSON.parse(pm.request.body.raw);\r

      \        const res = pm.response.json();\r

      \        pm.expect(res.nama).to.eql(req.nama);\r

      \    });\r

      }"
    language: text/javascript
  - type: beforeRequest
    code: ""
    language: text/javascript
order: 5000
