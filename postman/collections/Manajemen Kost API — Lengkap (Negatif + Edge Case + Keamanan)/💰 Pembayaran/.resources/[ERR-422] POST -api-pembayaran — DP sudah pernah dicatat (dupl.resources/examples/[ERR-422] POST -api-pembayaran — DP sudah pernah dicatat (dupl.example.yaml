$kind: http-example
name: "[ERR-422] POST /api/pembayaran — DP sudah pernah dicatat (duplikat DP)"
request:
  url: "{{base_url}}/api/pembayaran"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_penghunian": 16,
        "jenis_pembayaran": "dp",
        "tanggal_bayar": "2026-11-03",
        "jumlah": 500000,
        "metode_pembayaran": "Transfer Bank"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 02:09:04 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "DP untuk penghunian ini sudah pernah dicatat.",
        "error": {
          "code": "DP_ALREADY_EXISTS",
          "message": "DP untuk penghunian ini sudah pernah dicatat.",
          "status": "INVALID_ARGUMENT",
          "details": {}
        }
      }
order: 1000
