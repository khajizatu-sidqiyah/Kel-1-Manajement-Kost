$kind: http-example
name: "[ERR-422] POST /api/pembayaran — jenis_pembayaran tidak valid"
request:
  url: "{{base_url}}/api/pembayaran"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_penghunian": 16,
        "jenis_pembayaran": "uang_muka",
        "tanggal_bayar": "2026-11-01",
        "jumlah": 500000,
        "metode_pembayaran": "Cash"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 02:07:47 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Parameter permintaan tidak valid.",
        "error": {
          "code": 422,
          "message": "Validasi gagal.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "jenis_pembayaran": [
              "The selected jenis pembayaran is invalid."
            ]
          }
        }
      }
order: 1000
