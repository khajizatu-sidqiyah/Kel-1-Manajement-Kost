$kind: http-request
name: "[ERR-422] POST /api/pembayaran — DP di bawah minimum"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": 16,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-01",
      "jumlah": 1,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 — DP_BELOW_MINIMUM', () => {
        pm.expect(pm.response.code).to.eql(422);
        const code = pm.response.json().error.code;
        pm.expect(['DP_BELOW_MINIMUM', 'DP_ALREADY_EXISTS', 'RENT_SCHEME_NOT_SELECTED']).to.include(code);
      });
    language: text/javascript
examples: .resources/[ERR-422] POST -api-pembayaran — DP di bawah minimum.resources/examples
order: 7000
