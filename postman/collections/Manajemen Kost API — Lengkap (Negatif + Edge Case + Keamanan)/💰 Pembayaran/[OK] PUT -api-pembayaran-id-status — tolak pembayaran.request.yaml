$kind: http-request
name: "[OK] PUT /api/pembayaran/:id/status — tolak pembayaran"
url: "{{base_url}}/api/pembayaran/{{pembayaran_id}}/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "status": "ditolak"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status pembayaran = ditolak', () => {
        pm.expect(pm.response.json().data.pembayaran.status).to.eql('ditolak');
      });
    language: text/javascript
order: 21000
