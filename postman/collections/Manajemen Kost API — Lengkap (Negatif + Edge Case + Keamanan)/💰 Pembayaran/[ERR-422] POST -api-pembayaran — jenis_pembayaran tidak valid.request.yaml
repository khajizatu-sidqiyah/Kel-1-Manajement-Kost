$kind: http-request
name: "[ERR-422] POST /api/pembayaran — jenis_pembayaran tidak valid"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": 16,
      "jenis_pembayaran": "uang_muka",
      "tanggal_bayar": "2026-11-01",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422', () => pm.response.to.have.status(422));
    language: text/javascript
examples: .resources/[ERR-422] POST -api-pembayaran — jenis_pembayaran tidak valid.resources/examples
order: 3000
