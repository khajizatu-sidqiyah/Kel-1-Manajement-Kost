$kind: http-request
name: "[ERR-422] POST /api/pembayaran — tanggal_bayar format salah"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": 16,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "01-11-2026",
      "jumlah": 500000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422', () => pm.response.to.have.status(422));
    language: text/javascript
examples: .resources/[ERR-422] POST -api-pembayaran — tanggal_bayar format salah.resources/examples
order: 11000
