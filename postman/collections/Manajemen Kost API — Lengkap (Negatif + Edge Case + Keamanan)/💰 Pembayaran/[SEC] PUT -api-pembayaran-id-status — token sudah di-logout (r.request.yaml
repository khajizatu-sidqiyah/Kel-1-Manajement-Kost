$kind: http-request
name: "[SEC] PUT /api/pembayaran/:id/status — token sudah di-logout (revoked)"
url: "{{base_url}}/api/pembayaran/1/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: "{{bearer_token_0w3c}}"
body:
  type: text
  content: |-
    {
      "status": "terverifikasi"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401 — token revoked', () => pm.response.to.have.status(401));
    language: text/javascript
order: 27000
