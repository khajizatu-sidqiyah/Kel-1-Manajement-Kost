$kind: http-request
name: "[OK] POST /api/pembayaran — catat pembayaran DP"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": 16,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-01",
      "jumlah": 500000,
      "metode_pembayaran": "Transfer Bank",
      "bukti_pembayaran": "https://drive.google.com/bukti.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201 atau 422 (jika DP sudah ada)', () => {
        pm.expect([201, 422]).to.include(pm.response.code);
      });
      if (pm.response.code === 201) {
        const json = pm.response.json();
        pm.collectionVariables.set('pembayaran_id', json.data.pembayaran.id_pembayaran);
      }
    language: text/javascript
examples: .resources/[OK] POST -api-pembayaran — catat pembayaran DP.resources/examples
order: 2000
