$kind: http-request
name: "[ERR-422] PUT /api/pembayaran/:id/status — field status tidak dikirim"
url: "{{base_url}}/api/pembayaran/{{pembayaran_id}}/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: pm.test('Status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 24000
