$kind: http-request
name: "[ERR-422] PUT /api/pembayaran/:id — mengubah pembayaran yang sudah terverifikasi"
url: "{{base_url}}/api/pembayaran/{{pembayaran_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "jumlah": 999999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 — PAYMENT_ALREADY_VERIFIED', () => {
        pm.expect(pm.response.code).to.eql(422);
        pm.expect(pm.response.json().error.code).to.eql('PAYMENT_ALREADY_VERIFIED');
      });
    language: text/javascript
order: 17000
