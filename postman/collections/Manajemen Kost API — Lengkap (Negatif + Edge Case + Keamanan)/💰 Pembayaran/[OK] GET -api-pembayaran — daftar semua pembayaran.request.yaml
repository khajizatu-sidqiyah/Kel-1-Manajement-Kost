$kind: http-request
name: "[OK] GET /api/pembayaran — daftar semua pembayaran"
url: "{{base_url}}/api/pembayaran"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('data adalah array', () => {
        pm.expect(pm.response.json().data).to.be.an('array');
      });
    language: text/javascript
examples: .resources/[OK] GET -api-pembayaran — daftar semua pembayaran.resources/examples
order: 1000
