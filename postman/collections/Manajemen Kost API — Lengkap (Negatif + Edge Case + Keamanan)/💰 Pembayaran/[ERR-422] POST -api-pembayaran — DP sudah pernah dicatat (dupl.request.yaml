$kind: http-request
name: "[ERR-422] POST /api/pembayaran — DP sudah pernah dicatat (duplikat DP)"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": 16,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-03",
      "jumlah": 500000,
      "metode_pembayaran": "Transfer Bank"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 — DP_ALREADY_EXISTS', () => {
        pm.expect(pm.response.code).to.eql(422);
        pm.expect(pm.response.json().error.code).to.eql('DP_ALREADY_EXISTS');
      });
    language: text/javascript
examples: .resources/[ERR-422] POST -api-pembayaran — DP sudah pernah dicatat (dupl.resources/examples
order: 6000
