$kind: http-request
name: "[ERR-422] POST /api/pembayaran — jumlah negatif"
url: "{{base_url}}/api/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_penghunian": 16,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-01",
      "jumlah": -100000,
      "metode_pembayaran": "Cash"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 — jumlah tidak boleh negatif', () => pm.response.to.have.status(422));
    language: text/javascript
examples: .resources/[ERR-422] POST -api-pembayaran — jumlah negatif.resources/examples
order: 5000
