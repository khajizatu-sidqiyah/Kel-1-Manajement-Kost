$kind: http-request
name: "[ERR-422] POST /api/kamar — status nilai tidak valid"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": "B01",
      "harga": 500000,
      "status": "tidak_valid"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 — status harus kosong/terisi', () => pm.response.to.have.status(422));
    language: text/javascript
order: 8000
