$kind: http-request
name: "[SEC] PUT /api/kamar/:id — tanpa token"
url: "{{base_url}}/api/kamar/{{kamar_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "harga": 1200000
    }
scripts:
