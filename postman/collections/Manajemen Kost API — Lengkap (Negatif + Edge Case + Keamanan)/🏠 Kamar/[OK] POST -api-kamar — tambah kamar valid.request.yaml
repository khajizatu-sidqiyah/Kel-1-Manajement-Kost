$kind: http-request
name: "[OK] POST /api/kamar — tambah kamar valid"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": "A01",
      "tipe_kamar": "Standard",
      "harga": 1000000,
      "harga_tahunan": 10000000,
      "status": "kosong"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Kamar berhasil dibuat', () => {
        const json = pm.response.json();
        pm.expect(json.data).to.have.property('id_kamar');
        pm.collectionVariables.set('kamar_id', json.data.id_kamar);
      });
    language: text/javascript
order: 3000
