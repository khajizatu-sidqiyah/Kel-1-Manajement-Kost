$kind: http-request
name: "[ERR-422] POST /api/kamar — no_kamar kosong"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tipe_kamar": "Standard",
      "harga": 1000000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Error validasi no_kamar', () => {
        const details = pm.response.json().error.details;
        pm.expect(details).to.have.property('no_kamar');
      });
    language: text/javascript
order: 4000
