$kind: http-request
name: "[SEC] POST /api/kamar — tanpa token"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "no_kamar": "X01",
      "harga": 500000
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 11000
