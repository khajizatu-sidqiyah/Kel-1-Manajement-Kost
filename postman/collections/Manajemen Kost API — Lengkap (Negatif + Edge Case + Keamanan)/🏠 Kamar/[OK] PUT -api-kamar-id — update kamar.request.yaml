$kind: http-request
name: "[OK] PUT /api/kamar/:id — update kamar"
url: "{{base_url}}/api/kamar/{{kamar_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "harga": 1200000,
      "tipe_kamar": "Deluxe"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Data berhasil diperbarui', () => {
        pm.expect(pm.response.json().message).to.include('diperbarui');
      });
    language: text/javascript
order: 15000
