$kind: http-request
name: "[OK] GET /api/kamar/:id — detail kamar"
url: "{{base_url}}/api/kamar/{{kamar_id}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Memiliki id_kamar', () => {
        pm.expect(pm.response.json().data).to.have.property('id_kamar');
      });
    language: text/javascript
order: 12000
