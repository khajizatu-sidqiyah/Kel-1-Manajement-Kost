$kind: http-request
name: "[ERR-422] PUT /api/kamar/:id — status nilai tidak valid"
url: "{{base_url}}/api/kamar/{{kamar_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "status": "rusak"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 17000
