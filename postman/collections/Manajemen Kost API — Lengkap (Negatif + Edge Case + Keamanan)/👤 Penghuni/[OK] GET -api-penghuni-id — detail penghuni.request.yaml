$kind: http-request
name: "[OK] GET /api/penghuni/:id — detail penghuni"
url: "{{base_url}}/api/penghuni/{{penghuni_id}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000
