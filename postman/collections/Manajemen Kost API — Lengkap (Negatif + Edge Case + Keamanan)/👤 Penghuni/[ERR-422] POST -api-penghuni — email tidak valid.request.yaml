$kind: http-request
name: "[ERR-422] POST /api/penghuni — email tidak valid"
url: "{{base_url}}/api/penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nama_penghuni": "Joni",
      "email": "email-tidak-valid"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 — email tidak valid', () => pm.response.to.have.status(422));
    language: text/javascript
order: 7000
