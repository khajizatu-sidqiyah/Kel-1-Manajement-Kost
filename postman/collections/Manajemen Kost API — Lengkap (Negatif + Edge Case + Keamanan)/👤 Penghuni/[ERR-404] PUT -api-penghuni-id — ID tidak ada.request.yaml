$kind: http-request
name: "[ERR-404] PUT /api/penghuni/:id — ID tidak ada"
url: "{{base_url}}/api/penghuni/999999"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "alamat": "Jl. Tidak Ada"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 13000
