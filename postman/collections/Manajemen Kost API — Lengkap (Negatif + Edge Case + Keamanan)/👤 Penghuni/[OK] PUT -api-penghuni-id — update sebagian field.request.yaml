$kind: http-request
name: "[OK] PUT /api/penghuni/:id — update sebagian field"
url: "{{base_url}}/api/penghuni/{{penghuni_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "alamat": "Jl. Baru No. 99"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 12000
