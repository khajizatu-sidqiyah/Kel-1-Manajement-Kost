$kind: http-request
name: "[ERR-422] POST /api/penghuni — no_telepon terlalu panjang (> 13 digit)"
url: "{{base_url}}/api/penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nama_penghuni": "Siti",
      "no_telepon": "08123456789012345"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 — no_telepon > 13 digit', () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
