$kind: http-request
name: "[ERR-422] POST /api/penghuni — nama_penghuni kosong"
url: "{{base_url}}/api/penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_telepon": "081234567890"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Error pada nama_penghuni', () => {
        pm.expect(pm.response.json().error.details).to.have.property('nama_penghuni');
      });
    language: text/javascript
order: 3000
