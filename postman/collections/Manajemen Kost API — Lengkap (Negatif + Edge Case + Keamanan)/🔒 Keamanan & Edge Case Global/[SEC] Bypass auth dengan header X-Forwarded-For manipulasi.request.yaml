$kind: http-request
url: "{{base_url}}/api/kamar"
method: GET
headers:
  Accept: application/json
  X-Forwarded-For: 127.0.0.1
  X-Real-IP: 127.0.0.1
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tetap 401 — tidak bisa bypass dengan IP spoofing', () => {
        pm.expect(pm.response.code).to.eql(401);
      });
    language: text/javascript
order: 10000
