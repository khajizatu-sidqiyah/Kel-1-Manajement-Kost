$kind: http-request
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": "HACK01",
      "harga": 500000,
      "id_kost": 99,
      "id_kamar": 9999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tidak 500 — mass assignment harus dicegah fillable model', () => {
        pm.expect(pm.response.code).to.not.eql(500);
      });
    language: text/javascript
order: 11000
