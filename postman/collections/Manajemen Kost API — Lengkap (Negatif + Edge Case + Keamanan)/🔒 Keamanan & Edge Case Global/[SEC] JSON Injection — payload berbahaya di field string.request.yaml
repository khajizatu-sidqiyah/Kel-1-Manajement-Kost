$kind: http-request
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": {"$gt": ""},
      "harga": 500000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tidak 500 — JSON injection harus ditangkap validasi', () => {
        pm.expect(pm.response.code).to.not.eql(500);
      });
    language: text/javascript
order: 8000
