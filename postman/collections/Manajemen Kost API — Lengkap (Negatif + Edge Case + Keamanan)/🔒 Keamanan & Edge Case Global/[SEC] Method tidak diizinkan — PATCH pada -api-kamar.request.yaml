$kind: http-request
name: "[SEC] Method tidak diizinkan — PATCH pada /api/kamar"
url: "{{base_url}}/api/kamar"
method: PATCH
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 405 Method Not Allowed', () => {
        pm.expect([404, 405]).to.include(pm.response.code);
      });
    language: text/javascript
order: 4000
