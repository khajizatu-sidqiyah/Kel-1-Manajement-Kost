$kind: http-request
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": "A01",
      "harga": 500000,
      "data_ekstra": ""
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Server tidak crash — status bukan 500', () => {
        pm.expect(pm.response.code).to.not.eql(500);
      });
    language: text/javascript
order: 3000
