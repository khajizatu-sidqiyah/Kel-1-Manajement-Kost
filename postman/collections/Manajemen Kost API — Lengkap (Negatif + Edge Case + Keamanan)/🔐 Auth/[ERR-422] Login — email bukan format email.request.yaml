$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "penghuni.email",
      "password": "password123"
    }
auth:
  type: bearer
  credentials:
    token: 35|VtZqKtloVDaGlPM70eFgNLWX9w8YIzQob13rahEX22ec018b
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('error.status = INVALID_ARGUMENT', () => {
        pm.expect(pm.response.json().error.status).to.eql('INVALID_ARGUMENT');
      });
    language: text/javascript
examples: .resources/[ERR-422] Login — email bukan format email.resources/examples
order: 3000
