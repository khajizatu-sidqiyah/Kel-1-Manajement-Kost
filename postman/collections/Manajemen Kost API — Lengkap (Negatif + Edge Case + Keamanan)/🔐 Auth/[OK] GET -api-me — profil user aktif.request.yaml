$kind: http-request
name: "[OK] GET /api/me — profil user aktif"
url: "{{base_url}}/api/me"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Memiliki role', () => {
        pm.expect(pm.response.json().data).to.have.property('role');
      });
    language: text/javascript
examples: .resources/[OK] GET -api-me — profil user aktif.resources/examples
order: 7000
