$kind: http-request
name: "[SEC] GET /api/me — header Authorization tanpa prefix Bearer"
url: "{{base_url}}/api/me"
method: GET
headers:
  Accept: application/json
  Authorization: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
examples: .resources/[SEC] GET -api-me — header Authorization tanpa prefix Bearer.resources/examples
order: 10000
