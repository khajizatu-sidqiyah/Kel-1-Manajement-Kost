$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "pemilik@gmail.com",
      "password": "pemilik123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('error.status = UNAUTHENTICATED', () => {
        pm.expect(pm.response.json().error.status).to.eql('UNAUTHENTICATED');
      });
    language: text/javascript
examples: .resources/[ERR-401] Login — password salah.resources/examples
order: 2000
