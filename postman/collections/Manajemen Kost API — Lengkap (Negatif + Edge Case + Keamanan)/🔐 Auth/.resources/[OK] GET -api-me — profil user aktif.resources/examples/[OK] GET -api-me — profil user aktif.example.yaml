$kind: http-example
name: "[OK] GET /api/me — profil user aktif"
request:
  url: "{{base_url}}/api/me"
  method: GET
  headers:
    Accept: application/json
    Authorization: Bearer {{token}}
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 00:38:17 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "",
        "data": {
          "id": 1,
          "name": "Pemilik Kost",
          "email": "pemilik@gmail.com",
          "role": "pemilik"
        }
      }
order: 1000
