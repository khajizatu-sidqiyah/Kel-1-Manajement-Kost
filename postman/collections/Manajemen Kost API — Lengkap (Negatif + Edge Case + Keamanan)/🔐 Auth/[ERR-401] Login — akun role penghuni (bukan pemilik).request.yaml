$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "penghuni@gmail.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401 — role tidak cocok', () => pm.response.to.have.status(401));
    language: text/javascript
examples: .resources/[ERR-401] Login — akun role penghuni (bukan pemilik).resources/examples
order: 5000
