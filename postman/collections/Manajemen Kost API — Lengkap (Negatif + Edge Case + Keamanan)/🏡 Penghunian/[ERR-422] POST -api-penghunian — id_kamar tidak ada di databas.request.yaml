$kind: http-request
name: "[ERR-422] POST /api/penghunian — id_kamar tidak ada di database"
url: "{{base_url}}/api/penghunian"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": 999999,
      "id_penghuni": 3,
      "tanggal_mulai": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Error pada id_kamar', () => {
        const details = pm.response.json().error.details;
        pm.expect(JSON.stringify(details)).to.include('id_kamar');
      });
    language: text/javascript
examples: .resources/[ERR-422] POST -api-penghunian — id_kamar tidak ada di databas.resources/examples
order: 3000
