$kind: http-request
name: "[ERR-422] PUT /api/penghunian/:id/tenggat — tenggat sebelum tanggal_mulai"
url: "{{base_url}}/api/penghunian/16/tenggat"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tenggat_pelunasan": "2020-01-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 — INVALID_DUE_DATE', () => {
        pm.expect(pm.response.code).to.eql(422);
      });
    language: text/javascript
order: 23000
