$kind: http-request
name: "[OK] PUT /api/penghunian/:id — update tanggal"
url: "{{base_url}}/api/penghunian/16"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tanggal_mulai": "2026-11-05",
      "tanggal_selesai": "2026-12-05"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: .resources/[OK] PUT -api-penghunian-id — update tanggal.resources/examples
order: 11000
