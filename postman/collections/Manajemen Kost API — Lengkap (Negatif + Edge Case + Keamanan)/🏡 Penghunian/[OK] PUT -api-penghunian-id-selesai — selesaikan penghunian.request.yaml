$kind: http-request
name: "[OK] PUT /api/penghunian/:id/selesai — selesaikan penghunian"
url: "{{base_url}}/api/penghunian/{{penghunian_id}}/selesai"
method: PUT
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status penghunian = selesai', () => {
        pm.expect(pm.response.json().data.status).to.eql('selesai');
      });
    language: text/javascript
order: 27000
