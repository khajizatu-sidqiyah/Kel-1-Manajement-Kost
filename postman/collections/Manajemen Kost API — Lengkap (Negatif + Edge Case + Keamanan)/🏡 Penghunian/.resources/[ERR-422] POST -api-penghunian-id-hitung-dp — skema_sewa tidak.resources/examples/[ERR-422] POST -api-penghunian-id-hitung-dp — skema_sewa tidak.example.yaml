$kind: http-example
name: "[ERR-422] POST /api/penghunian/:id/hitung-dp — skema_sewa tidak valid"
request:
  url: "{{base_url}}/api/penghunian/16/hitung-dp"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "skema_sewa": "mingguan"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 01:23:02 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Parameter permintaan tidak valid.",
        "error": {
          "code": 422,
          "message": "Validasi gagal.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "skema_sewa": [
              "Skema sewa harus bulanan atau tahunan."
            ]
          }
        }
      }
order: 1000
