$kind: http-example
name: "[ERR-404] GET /api/penghunian/:id — ID tidak ada"
request:
  url: "{{base_url}}/api/penghunian/999999"
  method: GET
  headers:
    Accept: application/json
    Authorization: Bearer {{token}}
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 01:04:43 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data penghunian tidak ditemukan.",
        "error": {
          "code": "OCCUPANCY_NOT_FOUND",
          "message": "Data penghunian tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": {}
        }
      }
order: 1000
