$kind: http-example
name: "[ERR-422] POST /api/penghunian — id_kamar tidak ada di database"
request:
  url: "{{base_url}}/api/penghunian"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_kamar": 999999,
        "id_penghuni": 3,
        "tanggal_mulai": "2026-11-01"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 00:52:15 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data yang dikirim tidak valid.",
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "Data yang dikirim tidak valid.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "id_kamar": [
              "The selected id kamar is invalid."
            ]
          }
        }
      }
order: 1000
