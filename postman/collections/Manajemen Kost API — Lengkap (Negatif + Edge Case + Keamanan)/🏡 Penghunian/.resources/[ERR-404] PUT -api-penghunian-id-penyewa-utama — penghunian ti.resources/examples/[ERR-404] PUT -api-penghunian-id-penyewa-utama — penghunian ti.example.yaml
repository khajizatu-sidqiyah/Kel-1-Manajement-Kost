$kind: http-example
name: "[ERR-404] PUT /api/penghunian/:id/penyewa-utama — penghunian tidak aktif di kamar"
request:
  url: "{{base_url}}/api/penghunian/999999/penyewa-utama"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_kamar": 999
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 01:18:33 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Endpoint atau data tidak ditemukan.",
        "error": {
          "code": 404,
          "message": "Endpoint atau data tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": []
        }
      }
order: 1000
