$kind: http-example
name: "[ERR-404] POST /api/penghunian/:id/dp — penghunian tidak aktif / tidak ada"
request:
  url: "{{base_url}}/api/penghunian/999999/dp"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "tanggal_bayar": "2026-11-01",
        "jumlah": 500000,
        "metode_pembayaran": "Cash"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 01:30:04 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data penghunian aktif tidak ditemukan.",
        "error": {
          "code": "OCCUPANCY_NOT_FOUND",
          "message": "Data penghunian aktif tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": {}
        }
      }
order: 1000
