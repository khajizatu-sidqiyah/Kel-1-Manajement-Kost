$kind: http-example
name: "[ERR-422] POST /api/penghunian — tanggal_selesai sebelum tanggal_mulai"
request:
  url: "{{base_url}}/api/penghunian"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "id_kamar": 1,
        "id_penghuni": 15,
        "tanggal_mulai": "2026-11-30",
        "tanggal_selesai": "2026-11-01"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 00:55:14 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data yang dikirim tidak valid.",
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "Data yang dikirim tidak valid.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "tanggal_selesai": [
              "The tanggal selesai field must be a date after or equal to tanggal mulai."
            ]
          }
        }
      }
order: 1000
