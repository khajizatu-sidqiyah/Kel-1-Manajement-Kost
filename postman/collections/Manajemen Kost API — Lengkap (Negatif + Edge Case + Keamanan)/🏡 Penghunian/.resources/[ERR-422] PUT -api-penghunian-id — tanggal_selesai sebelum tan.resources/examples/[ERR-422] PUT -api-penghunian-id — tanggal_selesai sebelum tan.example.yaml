$kind: http-example
name: "[ERR-422] PUT /api/penghunian/:id — tanggal_selesai sebelum tanggal_mulai"
request:
  url: "{{base_url}}/api/penghunian/16"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "tanggal_mulai": "2026-12-01",
        "tanggal_selesai": "2026-11-01"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 01:06:57 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Parameter permintaan tidak valid.",
        "error": {
          "code": 422,
          "message": "Validasi gagal.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "tanggal_selesai": [
              "The tanggal selesai field must be a date after or equal to tanggal mulai."
            ]
          }
        }
      }
order: 1000
