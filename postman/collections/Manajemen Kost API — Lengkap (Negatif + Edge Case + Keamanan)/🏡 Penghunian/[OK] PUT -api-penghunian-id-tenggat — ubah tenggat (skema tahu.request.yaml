$kind: http-request
name: "[OK] PUT /api/penghunian/:id/tenggat — ubah tenggat (skema tahunan)"
url: "{{base_url}}/api/penghunian/16/tenggat"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tenggat_pelunasan": "2027-02-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200 atau 422 (jika bukan tahunan)', () => {
        pm.expect([200, 422]).to.include(pm.response.code);
      });
    language: text/javascript
order: 22000
