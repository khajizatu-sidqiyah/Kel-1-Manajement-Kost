$kind: http-request
name: "[ERR-404] PUT /api/penghunian/:id/penyewa-utama — penghunian tidak aktif di kamar"
url: "{{base_url}}/api/penghunian/999999/penyewa-utama"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": 999
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 404 — tidak ada penghunian aktif', () => pm.response.to.have.status(404));
    language: text/javascript
examples: .resources/[ERR-404] PUT -api-penghunian-id-penyewa-utama — penghunian ti.resources/examples
order: 14000
