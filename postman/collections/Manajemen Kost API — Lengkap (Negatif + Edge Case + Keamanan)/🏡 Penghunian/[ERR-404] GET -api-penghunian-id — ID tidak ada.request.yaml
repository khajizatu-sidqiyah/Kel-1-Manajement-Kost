$kind: http-request
name: "[ERR-404] GET /api/penghunian/:id — ID tidak ada"
url: "{{base_url}}/api/penghunian/999999"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('error.code = OCCUPANCY_NOT_FOUND', () => {
        pm.expect(pm.response.json().error.code).to.eql('OCCUPANCY_NOT_FOUND');
      });
    language: text/javascript
examples: .resources/[ERR-404] GET -api-penghunian-id — ID tidak ada.resources/examples
order: 10000
