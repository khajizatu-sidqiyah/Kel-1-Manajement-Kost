$kind: http-request
name: "[OK] POST /api/penghunian/:id/hitung-dp — hitung DP bulanan"
url: "{{base_url}}/api/penghunian/16/hitung-dp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "skema_sewa": "bulanan"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Memiliki dp_minimum', () => {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('dp_minimum');
      });
    language: text/javascript
examples: .resources/[OK] POST -api-penghunian-id-hitung-dp — hitung DP bulanan.resources/examples
order: 15000
