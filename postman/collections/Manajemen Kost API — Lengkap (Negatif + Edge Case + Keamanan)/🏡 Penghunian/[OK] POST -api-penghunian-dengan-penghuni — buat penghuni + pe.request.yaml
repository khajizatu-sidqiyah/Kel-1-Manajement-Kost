$kind: http-request
name: "[OK] POST /api/penghunian/dengan-penghuni — buat penghuni + penghunian sekaligus"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": 1,
      "nama_penghuni": "Dinda",
      "no_telepon": "08567890123",
      "alamat": "Bogor",
      "tanggal_mulai": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('Memiliki penghuni dan penghunian', () => {
        const data = pm.response.json().data;
        pm.expect(data).to.have.property('penghuni');
        pm.expect(data).to.have.property('penghunian');
        pm.collectionVariables.set('penghunian_id', data.penghunian.id_penghunian);
      });
    language: text/javascript
examples: .resources/[OK] POST -api-penghunian-dengan-penghuni — buat penghuni + pe.resources/examples
order: 7000
