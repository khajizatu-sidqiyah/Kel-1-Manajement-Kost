$kind: http-request
name: "[ERR-422] POST /api/penghunian — penghuni sudah terdaftar aktif di kamar yang sama"
url: "{{base_url}}/api/penghunian"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": 1,
      "id_penghuni": 15,
      "tanggal_mulai": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422 — TENANT_ALREADY_REGISTERED', () => {
        pm.expect(pm.response.code).to.eql(422);
        pm.expect(pm.response.json().error.code).to.eql('TENANT_ALREADY_REGISTERED');
      });
    language: text/javascript
examples: .resources/[ERR-422] POST -api-penghunian — penghuni sudah terdaftar akti.resources/examples
order: 4000
