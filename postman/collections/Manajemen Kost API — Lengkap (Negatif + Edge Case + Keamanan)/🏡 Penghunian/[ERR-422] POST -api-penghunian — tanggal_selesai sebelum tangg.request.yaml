$kind: http-request
name: "[ERR-422] POST /api/penghunian — tanggal_selesai sebelum tanggal_mulai"
url: "{{base_url}}/api/penghunian"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": 1,
      "id_penghuni": 15,
      "tanggal_mulai": "2026-11-30",
      "tanggal_selesai": "2026-11-01"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 — tanggal_selesai harus >= tanggal_mulai', () => pm.response.to.have.status(422));
    language: text/javascript
examples: .resources/[ERR-422] POST -api-penghunian — tanggal_selesai sebelum tangg.resources/examples
order: 5000
