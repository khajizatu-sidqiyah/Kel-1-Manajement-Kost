$kind: http-request
name: "[OK] GET /api/penghunian — daftar penghunian"
url: "{{base_url}}/api/penghunian"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('data adalah array', () => {
        pm.expect(pm.response.json().data).to.be.an('array');
      });
    language: text/javascript
examples: .resources/[OK] GET -api-penghunian — daftar penghunian.resources/examples
order: 1000
