$kind: http-request
name: "[ERR-422] POST /api/penghunian/dengan-penghuni — alamat kosong"
url: "{{base_url}}/api/penghunian/dengan-penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "id_kamar": 1,
      "nama_penghuni": "Dinda"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 422 — alamat wajib diisi', () => pm.response.to.have.status(422));
    language: text/javascript
examples: .resources/[ERR-422] POST -api-penghunian-dengan-penghuni — alamat kosong.resources/examples
order: 8000
