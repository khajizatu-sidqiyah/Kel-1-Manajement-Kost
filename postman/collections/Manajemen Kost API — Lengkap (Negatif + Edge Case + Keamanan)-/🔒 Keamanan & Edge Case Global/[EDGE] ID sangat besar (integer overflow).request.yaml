$kind: http-request
url: "{{base_url}}/api/kamar/99999999999999999999"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 404 atau 422 — ID overflow harus ditangani', () => {
        pm.expect([404, 422]).to.include(pm.response.code);
      });

      pm.test('ID overflow tidak mengembalikan data & tidak crash', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
order: 13000
