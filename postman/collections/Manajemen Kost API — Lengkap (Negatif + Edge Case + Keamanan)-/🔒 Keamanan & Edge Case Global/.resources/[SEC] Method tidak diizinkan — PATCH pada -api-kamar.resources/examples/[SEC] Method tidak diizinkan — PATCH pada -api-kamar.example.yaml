$kind: http-example
name: "[SEC] Method tidak diizinkan — PATCH pada /api/kamar"
request:
  url: "{{base_url}}/api/kamar"
  method: PATCH
  headers:
    Accept: application/json
    Authorization: Bearer {{token}}
response:
  statusCode: 405
  statusText: Method Not Allowed
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 09:51:01 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "The PATCH method is not supported for route api/kamar. Supported methods: GET, HEAD, POST.",
        "error": {
          "code": 405,
          "message": "The PATCH method is not supported for route api/kamar. Supported methods: GET, HEAD, POST.",
          "status": "ERROR",
          "details": {}
        }
      }
order: 1000
