$kind: http-request
name: "[SEC] Method tidak diizinkan — PATCH pada /api/kamar"
url: "{{base_url}}/api/kamar"
method: PATCH
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 405 Method Not Allowed', () => {
        pm.expect([404, 405]).to.include(pm.response.code);
      });

      pm.test('405: header Allow disertakan', () => {
        if (pm.response.code === 405) pm.expect(pm.response.headers.has('Allow')).to.be.true;
      });
    language: text/javascript
examples: .resources/[SEC] Method tidak diizinkan — PATCH pada -api-kamar.resources/examples
order: 4000
