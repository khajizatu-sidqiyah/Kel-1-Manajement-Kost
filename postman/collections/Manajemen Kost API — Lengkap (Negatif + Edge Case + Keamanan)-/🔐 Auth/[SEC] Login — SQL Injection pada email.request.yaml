$kind: http-request
url: "{{base_url}}/api/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "' OR 1=1 --",
      "password": "apasaja"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Tidak boleh 200 (injeksi harus ditolak)', () => {
        pm.expect(pm.response.code).to.not.eql(200);
      });

      pm.test('Injeksi ditolak (401 atau 422)', () => pm.expect([401, 422]).to.include(pm.response.code));
      pm.test('Tidak ada token yang diterbitkan', () => pm.expect(JSON.stringify(res)).to.not.include('"token"'));
    language: text/javascript
examples: .resources/[SEC] Login — SQL Injection pada email.resources/examples
order: 6000
