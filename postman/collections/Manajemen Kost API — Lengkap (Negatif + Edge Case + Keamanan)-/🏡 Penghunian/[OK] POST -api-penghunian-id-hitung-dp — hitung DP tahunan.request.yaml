$kind: http-request
name: "[OK] POST /api/penghunian/:id/hitung-dp — hitung DP tahunan"
url: "{{base_url}}/api/penghunian/{{penghunian_id}}/hitung-dp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "skema_sewa": "tahunan"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200 atau 422 (jika harga_tahunan null)', () => {
        pm.expect([200, 422]).to.include(pm.response.code);
      });

      pm.collectionVariables.set('tahunan_tersedia', String(pm.response.code === 200));
      pm.test('200: skema tahunan tersimpan | 422 INVALID_ANNUAL_DP_SETTING bila tabel pengaturan_sewa kosong', () => {
        if (pm.response.code === 200) {
          pm.expect(res.data.skema_sewa).to.eql('tahunan');
          pm.expect(Number(res.data.total_sewa)).to.eql(Number(res.data.kamar.harga_tahunan));
          pm.expect(Number(res.data.dp_minimum)).to.be.above(0);
        } else {
          pm.expect(res.error.code).to.eql('INVALID_ANNUAL_DP_SETTING');
        }
      });
    language: text/javascript
order: 16000
