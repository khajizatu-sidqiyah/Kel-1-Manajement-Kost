$kind: http-request
name: "[OK] PUT /api/pembayaran/:id/status — verifikasi pembayaran"
url: "{{base_url}}/api/pembayaran/{{pembayaran_id}}/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "status": "terverifikasi"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status pembayaran = terverifikasi', () => {
        pm.expect(pm.response.json().data.pembayaran.status).to.eql('terverifikasi');
      });

      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });
      pm.test('Total & sisa tagihan konsisten, status_pembayaran belum_lunas', () => {
        const d = res.data;
        pm.expect(d.pembayaran.status).to.eql('terverifikasi');
        pm.expect(Number(d.sisa_tagihan)).to.eql(Number(d.total_sewa) - Number(d.total_terbayar));
        pm.expect(Number(d.total_terbayar)).to.be.above(0);
        pm.expect(d.status_pembayaran).to.eql('belum_lunas');
      });
    language: text/javascript
order: 20000
