$kind: http-request
name: "[SEC] PUT /api/pembayaran/:id/status — token sudah di-logout (revoked)"
url: "{{base_url}}/api/pembayaran/1/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token_revoked}}
body:
  type: text
  content: |-
    {
      "status": "terverifikasi"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 401 — token revoked', () => pm.response.to.have.status(401));

      pm.test('401 - tidak ada data sensitif di respons', () => {
        pm.expect(res.data || {}).to.not.have.property('token');
        pm.expect(res.data || {}).to.not.have.property('password');
      });
      pm.test('401 - ada pesan / objek error', () => {
        pm.expect(res.message || res.error, 'respons harus memuat message atau error').to.exist;
      });
      pm.test('401 - jika ada error.status maka UNAUTHENTICATED', () => {
        if (res.error && res.error.status) pm.expect(res.error.status).to.eql('UNAUTHENTICATED');
      });
      pm.test('Token yang sudah di-logout benar-benar tidak berlaku', () => pm.expect(pm.response.code).to.eql(401));
    language: text/javascript
order: 27000
