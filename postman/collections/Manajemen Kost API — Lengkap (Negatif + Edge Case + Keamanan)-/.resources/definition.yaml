$kind: collection
name: Manajemen Kost API — Lengkap (Negatif + Edge Case + Keamanan) Copy
description: |-
  Postman collection lengkap untuk project Kel-1 Manajemen Kost (Laravel + Sanctum).

  Mencakup:
  - Happy path (skenario normal)
  - Negative cases (validasi gagal, data tidak ditemukan)
  - Edge cases (batas nilai, duplikat, konflik status)
  - Security checks (tanpa token, token palsu, role salah, header salah)

  Pastikan:
  1. Jalankan 'POST /api/login' terlebih dahulu → token otomatis tersimpan ke variable 'token'
  2. Base URL default: http://localhost:8000
  3. Semua endpoint protected membutuhkan Bearer token

  Script otomatis (collection-level):
  - Pre-request: auto-login jika {{token}} kosong (variabel email_pemilik / password_pemilik).
  - Test: waktu respons, bukan 5xx, Content-Type JSON, dan deteksi kebocoran stack trace/SQL pada request [SEC].
  Request DELETE kamar/penghuni dan PUT selesai memakai data sementara agar ID utama tetap utuh untuk folder berikutnya.
variables:
  - key: base_url
    value: http://localhost:8000
    disabled: false
    secret: false
  - key: token
    value: ""
    disabled: false
    secret: false
  - key: kamar_id
    value: "1"
    disabled: false
    secret: false
  - key: penghuni_id
    value: "1"
    disabled: false
    secret: false
  - key: penghunian_id
    value: "1"
    disabled: false
    secret: false
  - key: pembayaran_id
    value: "1"
    disabled: false
    secret: false
  - key: email_pemilik
    value: pemilik@gmail.com
    disabled: false
    secret: false
  - key: password_pemilik
    value: password123
    disabled: false
    secret: false
  - key: token_revoked
    value: ""
    disabled: false
    secret: false
  - key: kamar_hapus_id
    value: ""
    disabled: false
    secret: false
  - key: penghuni_hapus_id
    value: ""
    disabled: false
    secret: false
  - key: penghunian_selesai_id
    value: ""
    disabled: false
    secret: false
  - key: penghunian_baru_id
    value: ""
    disabled: false
    secret: false
  - key: tahunan_tersedia
    value: ""
    disabled: false
    secret: false
  - key: cek_kebocoran_debug
    value: "false"
    disabled: false
    secret: false
  - key: bearer_token_12j6
    secret: true
    disabled: false
scripts:
  - type: http:beforeRequest
    code: |-
      // === Auto-login: jika request memakai {{token}} tapi token kosong (mis. setelah logout / run pertama) ===
      const authHeader = pm.request.headers.get('Authorization') || '';
      const usesToken = authHeader.indexOf('{{token}}') !== -1;
      const isLogin = pm.info.requestName.indexOf('Login') !== -1;
      if (usesToken && !isLogin && !pm.collectionVariables.get('token')) {
        pm.sendRequest({
          url: pm.variables.replaceIn('{{base_url}}') + '/api/login',
          method: 'POST',
          header: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: { mode: 'raw', raw: JSON.stringify({
            email: pm.collectionVariables.get('email_pemilik'),
            password: pm.collectionVariables.get('password_pemilik')
          }) }
        }, (err, resp) => {
          if (err || resp.code !== 200) { console.error('Auto-login gagal:', err || resp.code); return; }
          pm.collectionVariables.set('token', resp.json().data.token);
        });
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // === Pengecekan umum yang berlaku untuk SEMUA request ===
      const code = pm.response.code;
      const accept = pm.request.headers.get('Accept') || '';

      pm.test('Waktu respons < 3000 ms', () => {
        pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      pm.test('Server tidak mengembalikan 5xx', () => {
        pm.expect(code, 'status ' + code).to.be.below(500);
      });

      if (accept.indexOf('application/json') !== -1 && code !== 204 && code !== 413) {
        pm.test('Content-Type respons adalah application/json', () => {
          pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json');
        });
      }

      if (pm.info.requestName.indexOf('[SEC]') === 0) {
        const leak = /SQLSTATE|Stack trace|\/vendor\/|\\vendor\\|Illuminate\\|PDOException/i.test(pm.response.text());
        if (pm.collectionVariables.get('cek_kebocoran_debug') === 'true') {
          pm.test('Tidak membocorkan stack trace / error SQL / path server', () => pm.expect(leak).to.be.false);
        } else if (leak) {
          console.warn('[PERINGATAN] Respons memuat stack trace (APP_DEBUG=true). Set APP_DEBUG=false di production, lalu ubah variable cek_kebocoran_debug = true.');
        }
      }
    language: text/javascript
