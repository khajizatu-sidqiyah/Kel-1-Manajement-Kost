$kind: http-example
name: "[SEC] POST /api/kamar — tanpa token"
request:
  url: "{{base_url}}/api/kamar"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "no_kamar": "X01",
        "harga": 500000
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:18:05 GMT
    Content-Type: application/json
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Autentikasi diperlukan.",
        "error": {
          "code": 401,
          "message": "Token tidak ada atau tidak valid.",
          "status": "UNAUTHENTICATED",
          "details": {}
        }
      }
order: 1000
