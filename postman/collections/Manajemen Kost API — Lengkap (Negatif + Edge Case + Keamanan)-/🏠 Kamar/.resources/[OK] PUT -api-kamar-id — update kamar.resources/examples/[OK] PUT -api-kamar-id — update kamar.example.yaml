$kind: http-example
name: "[OK] PUT /api/kamar/:id — update kamar"
request:
  url: "{{base_url}}/api/kamar/{{kamar_id}}"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "harga": 1200000,
        "tipe_kamar": "Deluxe"
      }
