$kind: http-example
name: "[ERR-404] PUT /api/kamar/:id — ID tidak ada"
request:
  url: "{{base_url}}/api/kamar/999999"
  method: PUT
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "harga": 1200000
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:22:15 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data kamar tidak ditemukan.",
        "error": {
          "code": 404,
          "message": "Kamar dengan ID 999999 tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": []
        }
      }
order: 1000
