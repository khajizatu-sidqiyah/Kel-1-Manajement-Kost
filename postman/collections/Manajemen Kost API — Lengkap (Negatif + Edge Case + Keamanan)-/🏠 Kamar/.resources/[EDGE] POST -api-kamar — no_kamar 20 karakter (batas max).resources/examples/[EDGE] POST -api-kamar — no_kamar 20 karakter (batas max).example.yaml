$kind: http-example
name: "[EDGE] POST /api/kamar — no_kamar 20 karakter (batas max)"
request:
  url: "{{base_url}}/api/kamar"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "no_kamar": "12345678901234567890",
        "harga": 750000
      }
