$kind: http-example
name: "[ERR-422] POST /api/kamar — harga tidak disertakan"
request:
  url: "{{base_url}}/api/kamar"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "no_kamar": "A02",
        "tipe_kamar": "Standard"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:12:36 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Parameter permintaan tidak valid.",
        "error": {
          "code": 422,
          "message": "Validasi gagal.",
          "status": "INVALID_ARGUMENT",
          "details": {
            "harga": [
              "The harga field is required."
            ]
          }
        }
      }
order: 1000
