$kind: http-request
name: "[OK] DELETE /api/kamar/:id — hapus kamar"
url: "{{base_url}}/api/kamar/{{kamar_hapus_id}}"
method: DELETE
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: beforeRequest
    code: |-
      // Buat kamar sementara supaya kamar_id utama (dipakai folder Penghunian & Pembayaran) tidak terhapus
      const base = pm.variables.replaceIn('{{base_url}}');
      pm.sendRequest({
        url: base + '/api/kamar',
        method: 'POST',
        header: {
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + pm.collectionVariables.get('token')
        },
        body: { mode: 'raw', raw: JSON.stringify({ no_kamar: 'DEL' + String(Date.now()).slice(-9), harga: 500000 }) }
      }, (err, resp) => {
        if (err) { console.error('Gagal membuat kamar sementara:', err); return; }
        const id = resp.json().data.id_kamar;
        pm.collectionVariables.set('kamar_hapus_id', id);
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('data null setelah hapus', () => {
        pm.expect(pm.response.json().data).to.be.null;
      });

      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });
      pm.test('data null setelah hapus', () => pm.expect(res.data).to.be.null);
      // verifikasi benar-benar terhapus: GET harus 404
      pm.sendRequest({
        url: pm.variables.replaceIn('{{base_url}}') + '/api/kamar/' + pm.collectionVariables.get('kamar_hapus_id'),
        method: 'GET',
        header: { 'Accept': 'application/json', 'Authorization': 'Bearer ' + pm.collectionVariables.get('token') }
      }, (err, resp) => {
        pm.test('Kamar yang dihapus tidak bisa diakses lagi (GET -> 404)', () => {
          pm.expect(err).to.be.null;
          pm.expect(resp.code).to.eql(404);
        });
      });
    language: text/javascript
order: 19000
