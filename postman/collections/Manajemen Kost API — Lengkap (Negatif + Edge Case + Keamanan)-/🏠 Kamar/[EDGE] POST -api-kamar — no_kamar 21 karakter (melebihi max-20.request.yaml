$kind: http-request
name: "[EDGE] POST /api/kamar — no_kamar 21 karakter (melebihi max:20)"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "no_kamar": "123456789012345678901",
      "harga": 750000
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 422 — no_kamar > 20 char ditolak', () => pm.response.to.have.status(422));

      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });
      pm.test('422 - error.details memuat field: no_kamar', () => {
        const details = JSON.stringify(res.error.details || {});
        ["no_kamar"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });
      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
examples: .resources/[EDGE] POST -api-kamar — no_kamar 21 karakter (melebihi max-20.resources/examples
order: 10000
