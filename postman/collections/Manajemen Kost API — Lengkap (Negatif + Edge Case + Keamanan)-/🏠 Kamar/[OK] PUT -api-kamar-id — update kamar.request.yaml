$kind: http-request
name: "[OK] PUT /api/kamar/:id — update kamar"
url: "{{base_url}}/api/kamar/{{kamar_id}}"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "harga": 1200000,
      "tipe_kamar": "Deluxe"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Data berhasil diperbarui', () => {
        pm.expect(pm.response.json().message).to.include('diperbarui');
      });

      pm.test('Envelope sukses: message (string) & data ada', () => {
        pm.expect(res).to.have.property('message');
        pm.expect(res.message).to.be.a('string');
        pm.expect(res).to.have.property('data');
      });
      pm.test('Field hasil update sesuai payload (harga 1.200.000, tipe Deluxe)', () => {
        pm.expect(Number(res.data.harga)).to.eql(1200000);
        pm.expect(res.data.tipe_kamar).to.eql('Deluxe');
      });
      pm.test('ID kamar tidak berubah', () => pm.expect(String(res.data.id_kamar)).to.eql(String(pm.collectionVariables.get('kamar_id'))));
    language: text/javascript
examples: .resources/[OK] PUT -api-kamar-id — update kamar.resources/examples
order: 15000
