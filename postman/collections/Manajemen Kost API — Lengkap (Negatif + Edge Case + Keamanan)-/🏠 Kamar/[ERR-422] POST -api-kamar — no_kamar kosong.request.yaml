$kind: http-request
name: "[ERR-422] POST /api/kamar — no_kamar kosong"
url: "{{base_url}}/api/kamar"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "tipe_kamar": "Standard",
      "harga": 1000000
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Error validasi no_kamar', () => {
        const details = pm.response.json().error.details;
        pm.expect(details).to.have.property('no_kamar');
      });

      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });
      pm.test('422 - error.details memuat field: no_kamar', () => {
        const details = JSON.stringify(res.error.details || {});
        ["no_kamar"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });
      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
examples: .resources/[ERR-422] POST -api-kamar — no_kamar kosong.resources/examples
order: 4000
