$kind: http-request
name: "[ERR-404] GET /api/kamar/:id — ID tidak ada"
url: "{{base_url}}/api/kamar/999999"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.test('error.status = NOT_FOUND', () => {
        pm.expect(pm.response.json().error.status).to.eql('NOT_FOUND');
      });

      pm.test('404 - error.status = NOT_FOUND', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('NOT_FOUND');
      });
      pm.test('404 - tidak ada data yang dikembalikan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
examples: .resources/[ERR-404] GET -api-kamar-id — ID tidak ada.resources/examples
order: 13000
