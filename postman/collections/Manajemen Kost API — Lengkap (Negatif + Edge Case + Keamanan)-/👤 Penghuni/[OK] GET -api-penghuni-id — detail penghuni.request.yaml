$kind: http-request
name: "[OK] GET /api/penghuni/:id — detail penghuni"
url: "{{base_url}}/api/penghuni/{{penghuni_id}}"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 200', () => pm.response.to.have.status(200));

      pm.test('Detail sesuai ID yang diminta (penghuni_id)', () => {
        const d = res.data;
        pm.expect(String(d.id_penghuni)).to.eql(String(pm.collectionVariables.get('penghuni_id')));
      });
    language: text/javascript
examples: .resources/[OK] GET -api-penghuni-id — detail penghuni.resources/examples
order: 10000
