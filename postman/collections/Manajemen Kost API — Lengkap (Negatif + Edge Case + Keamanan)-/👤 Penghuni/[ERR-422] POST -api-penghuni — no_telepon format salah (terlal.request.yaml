$kind: http-request
name: "[ERR-422] POST /api/penghuni — no_telepon format salah (terlalu pendek)"
url: "{{base_url}}/api/penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "nama_penghuni": "Siti",
      "no_telepon": "08123"
    }
scripts:
  - type: afterResponse
    code: |-
      let res = {};
      try { res = pm.response.json(); } catch (e) { /* body bukan JSON */ }

      pm.test('Status 422 — no_telepon < 10 digit', () => pm.response.to.have.status(422));

      pm.test('422 - error.status = INVALID_ARGUMENT', () => {
        pm.expect(res).to.have.property('error');
        pm.expect(res.error.status).to.eql('INVALID_ARGUMENT');
      });
      pm.test('422 - error.details memuat field: no_telepon', () => {
        const details = JSON.stringify(res.error.details || {});
        ["no_telepon"].forEach(f => pm.expect(details, 'field ' + f).to.include(f));
      });
      pm.test('422 - tidak ada data yang tersimpan', () => {
        pm.expect(res.data === undefined || res.data === null).to.be.true;
      });
    language: text/javascript
examples: .resources/[ERR-422] POST -api-penghuni — no_telepon format salah (terlal.resources/examples
order: 4000
