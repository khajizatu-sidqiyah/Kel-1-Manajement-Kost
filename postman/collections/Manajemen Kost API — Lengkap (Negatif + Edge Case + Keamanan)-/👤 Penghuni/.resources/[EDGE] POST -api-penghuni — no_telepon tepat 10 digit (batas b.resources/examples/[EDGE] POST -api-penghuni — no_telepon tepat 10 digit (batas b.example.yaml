$kind: http-example
name: "[EDGE] POST /api/penghuni — no_telepon tepat 10 digit (batas bawah valid)"
request:
  url: "{{base_url}}/api/penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "nama_penghuni": "Edge Case User",
        "no_telepon": "0812345678"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:30:00 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Penghuni berhasil ditambahkan.",
        "data": {
          "nama_penghuni": "Edge Case User",
          "no_telepon": "0812345678",
          "updated_at": "2026-11-04T10:30:00.000000Z",
          "created_at": "2026-11-04T10:30:00.000000Z",
          "id_penghuni": 90
        }
      }
order: 1000
