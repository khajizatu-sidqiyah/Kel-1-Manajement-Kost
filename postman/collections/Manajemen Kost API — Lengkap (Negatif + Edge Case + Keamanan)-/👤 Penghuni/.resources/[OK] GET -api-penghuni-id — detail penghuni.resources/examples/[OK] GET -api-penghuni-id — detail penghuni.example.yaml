$kind: http-example
name: "[OK] GET /api/penghuni/:id — detail penghuni"
request:
  url: "{{base_url}}/api/penghuni/{{penghuni_id}}"
  method: GET
  headers:
    Accept: application/json
    Authorization: Bearer {{token}}
response:
  statusCode: 200
  statusText: OK
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:34:44 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "",
        "data": {
          "id_penghuni": 91,
          "user_id": null,
          "nama_penghuni": "Budi Santoso",
          "no_telepon": "081234567890",
          "email": "budi@example.com",
          "alamat": "Jl. Baru No. 99",
          "created_at": "2026-11-04T10:31:49.000000Z",
          "updated_at": "2026-11-04T10:31:58.000000Z"
        }
      }
order: 1000
