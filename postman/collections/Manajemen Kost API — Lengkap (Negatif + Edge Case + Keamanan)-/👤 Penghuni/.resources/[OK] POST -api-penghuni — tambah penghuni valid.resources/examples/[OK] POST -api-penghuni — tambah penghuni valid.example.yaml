$kind: http-example
name: "[OK] POST /api/penghuni — tambah penghuni valid"
request:
  url: "{{base_url}}/api/penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "nama_penghuni": "Budi Santoso",
        "no_telepon": "081234567890",
        "email": "budi@example.com",
        "alamat": "Jl. Merdeka No. 1"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:26:21 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Penghuni berhasil ditambahkan.",
        "data": {
          "nama_penghuni": "Budi Santoso",
          "no_telepon": "081234567890",
          "email": "budi@example.com",
          "alamat": "Jl. Merdeka No. 1",
          "updated_at": "2026-11-04T10:26:21.000000Z",
          "created_at": "2026-11-04T10:26:21.000000Z",
          "id_penghuni": 89
        }
      }
order: 1000
