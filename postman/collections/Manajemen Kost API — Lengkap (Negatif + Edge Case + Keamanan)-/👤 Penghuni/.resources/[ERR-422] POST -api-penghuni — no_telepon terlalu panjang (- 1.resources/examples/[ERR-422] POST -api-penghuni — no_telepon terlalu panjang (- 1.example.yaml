$kind: http-example
name: "[ERR-422] POST /api/penghuni — no_telepon terlalu panjang (> 13 digit)"
request:
  url: "{{base_url}}/api/penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "nama_penghuni": "Siti",
        "no_telepon": "08123456789012345"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 10:29:09 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Invalid request parameters.",
        "error": {
          "code": 422,
          "message": "Validation failed",
          "status": "INVALID_ARGUMENT",
          "details": {
            "no_telepon": [
              "The no telepon field must be between 10 and 13 digits."
            ]
          }
        }
      }
order: 1000
