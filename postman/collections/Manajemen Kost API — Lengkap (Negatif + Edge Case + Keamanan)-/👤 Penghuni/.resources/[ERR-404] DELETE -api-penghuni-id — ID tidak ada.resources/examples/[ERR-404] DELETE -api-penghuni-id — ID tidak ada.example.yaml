$kind: http-example
name: "[ERR-404] DELETE /api/penghuni/:id — ID tidak ada"
request:
  url: "{{base_url}}/api/penghuni/999999"
  method: DELETE
  headers:
    Accept: application/json
    Authorization: Bearer {{token}}
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: localhost:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Wed, 04 Nov 2026 12:05:52 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data penghuni tidak ditemukan.",
        "error": {
          "code": 404,
          "message": "Penghuni dengan ID 999999 tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": []
        }
      }
order: 1000
