$kind: http-request
url: "{{base_url}}/penghunian/{{penB2}}/hitung-dp"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "skema_sewa": "bulanan"
    }
scripts:
  - type: afterResponse
    code: |-
      // ===== helper bersama =====
      const body = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
      const d10 = (v) => (v === null || v === undefined) ? null : String(v).slice(0, 10);
      const num = (v) => Number(v);
      const cv = (k) => pm.collectionVariables.get(k);
      const setcv = (k, v) => pm.collectionVariables.set(k, v);

      function sukses(httpStatus) {
        pm.test('Status HTTP ' + httpStatus, () => pm.response.to.have.status(httpStatus));
        pm.test('Content-Type JSON', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
        pm.test('Format sukses {message, data} dan tidak ada "error"', () => {
          pm.expect(body, 'body JSON').to.be.an('object');
          pm.expect(body).to.have.property('message');
          pm.expect(body).to.have.property('data');
          pm.expect(body).to.not.have.property('error');
        });
      }
      function gagal(httpStatus, pesanRegex) {
        pm.test('Status HTTP ' + httpStatus, () => pm.response.to.have.status(httpStatus));
        pm.test('Content-Type JSON', () => pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json'));
        pm.test('Format gagal {message, error{code,message,status,details}}', () => {
          pm.expect(body, 'body JSON').to.be.an('object');
          pm.expect(body).to.have.property('message');
          pm.expect(body).to.have.property('error');
          pm.expect(body.error).to.have.property('code');
          pm.expect(body.error).to.have.property('message');
          pm.expect(body.error).to.have.property('status');
          pm.expect(body.error).to.have.property('details');
          pm.expect(body).to.not.have.property('data');
        });
        if (pesanRegex) {
          pm.test('Pesan error sesuai: ' + pesanRegex, () => pm.expect(JSON.stringify(body)).to.match(pesanRegex));
        }
      }
      // Kode error spesifik (mis. DP_BELOW_MINIMUM). Dipisah supaya jelas kalau ApiContractMiddleware menimpa kodenya.
      function kodeError(kode) {
        pm.test('Kode error spesifik ' + kode + ' muncul di error.code/status/details', () => {
          const e = (body && body.error) || {};
          const ditemukan = [e.code, e.status, JSON.stringify(e.details || {})].some(v => String(v).includes(kode));
          pm.expect(ditemukan, 'error = ' + JSON.stringify(e)).to.be.true;
        });
      }
      function bayarOK(jenis, jumlah) {
        pm.test('Pembayaran tersimpan: jenis=' + jenis + ', jumlah=' + jumlah + ', status=terverifikasi', () => {
          const p = body.data.pembayaran;
          pm.expect(p.jenis_pembayaran).to.eql(jenis);
          pm.expect(num(p.jumlah)).to.eql(jumlah);
          pm.expect(p.status).to.eql('terverifikasi');
          pm.expect(p).to.have.property('id_pembayaran');
        });
      }
      function ringkasan(total, terbayar, sisa, status) {
        pm.test('Ringkasan: total=' + total + ', terbayar=' + terbayar + ', sisa=' + sisa + ', status=' + status, () => {
          pm.expect(num(body.data.total_sewa)).to.eql(total);
          pm.expect(num(body.data.total_terbayar)).to.eql(terbayar);
          pm.expect(num(body.data.sisa_tagihan)).to.eql(sisa);
          pm.expect(body.data.status_pembayaran).to.eql(status);
        });
      }
      // ===== akhir helper =====

      sukses(200);
      pm.test('skema_sewa = bulanan', () => pm.expect(body.data.skema_sewa).to.eql('bulanan'));
      pm.test('total_sewa = 600000', () => pm.expect(num(body.data.total_sewa)).to.eql(600000));
      pm.test('DP minimum tampil = 300000', () => pm.expect(num(body.data.dp_minimum)).to.eql(300000));
      pm.test('Tenggat tampil = 2026-11-05', () => pm.expect(d10(body.data.tenggat_pelunasan)).to.eql("2026-11-05"));
      pm.test('status_pembayaran awal belum_lunas', () => pm.expect(body.data.status_pembayaran).to.eql('belum_lunas'));
    language: text/javascript
order: 4000
