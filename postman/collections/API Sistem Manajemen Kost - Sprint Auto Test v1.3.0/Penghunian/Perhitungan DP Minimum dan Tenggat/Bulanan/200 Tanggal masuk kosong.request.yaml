      \    const body = pm.response.json();\r

      \    pm.expect(body.message)\r

      \        .to.eql(\"Perhitungan sewa berhasil disimpan. Isi tanggal masuk untuk menentukan tenggat.\");\r

      });\r

      \r

      pm.test(\"Skema sewa bulanan tersimpan\", function () {\r

      \    const body = pm.response.json();\r

      \    pm.expect(body.data.skema_sewa).to.eql(\"bulanan\");\r

      });\r

      \r

      pm.test(\"Total sewa bulanan benar\", function () {\r

