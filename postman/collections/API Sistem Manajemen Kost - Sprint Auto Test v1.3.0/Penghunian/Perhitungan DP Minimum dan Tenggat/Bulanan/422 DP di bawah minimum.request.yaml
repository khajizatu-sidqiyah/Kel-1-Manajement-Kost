    \    \"id_penghunian\": 58,\r

    \    \"jenis_pembayaran\": \"dp\",\r

    \    \"tanggal_bayar\": \"2026-11-05\",\r

    \    \"jumlah\": 100000,\r

    \    \"metode_pembayaran\": \"Transfer Bank\",\r

    \    \"bukti_pembayaran\": null\r

    }"
scripts:
  - type: afterResponse
    code: "const jsonData = pm.response.json();\r

      \r

      const dpMinimum = 300000;\r

      const jumlahDP = 100000;\r

      \r

      pm.test(\"Respons menggunakan JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      pm.test(\"Status code 422 - DP ditolak\", function () {\r

      \    pm.response.to.have.status(422);\r

      });\r

      \r

      pm.test(\"Pesan penolakan DP sesuai\", function () {\r

      \    pm.expect(jsonData.message).to.eql(\r

      \        \"Pembayaran DP ditolak karena jumlahnya kurang dari DP minimum.\"\r

      \    );\r

      });\r

      \r

      pm.test(\"Kode error DP di bawah minimum\", function () {\r

      \    pm.expect(jsonData.error.code).to.eql(\"DP_BELOW_MINIMUM\");\r

      });\r

      \r

      pm.test(\"DP minimum sebesar Rp300.000\", function () {\r

      \    pm.expect(dpMinimum).to.eql(300000);\r

      });\r

      \r

      pm.test(\"Jumlah DP yang dimasukkan Rp100.000\", function () {\r

      \    pm.expect(jumlahDP).to.eql(100000);\r

      });\r

      \r

      pm.test(\"DP ditolak karena kurang dari minimum\", function () {\r

      \    pm.expect(jumlahDP).to.be.below(dpMinimum);\r

      });"
    language: text/javascript
