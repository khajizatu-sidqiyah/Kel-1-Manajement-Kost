$kind: collection
description: Collection untuk pengujian API dalam scope sprint saat ini. Pre-request dan Post-response sudah dipasang di level Collection agar berjalan otomatis. Endpoint /api/kos tidak disertakan karena di luar scope sprint yang dikonfirmasi. Jalankan pada database uji.
variables:
  base_url: http://127.0.0.1:8000/api
  token: ""
  email: pemilik@example.com
  password: GANTI_PASSWORD_UJI
  kamar_id: "1"
  penghuni_id: "1"
  penghunian_id: "1"
scripts:
  - type: http:beforeRequest
    code: |-
      // Berjalan otomatis sebelum setiap request dalam collection.
      // Pastikan semua request meminta respons JSON.
      pm.request.headers.upsert({ key: "Accept", value: "application/json" });

      // Pakai token tersimpan otomatis untuk endpoint selain login.
      const requestUrl = pm.request.url.toString();
      if (!requestUrl.includes("/api/login")) {
          const token = pm.collectionVariables.get("token");
          if (token) {
              pm.request.headers.upsert({ key: "Authorization", value: "Bearer " + token });
          }
      }
      console.log("[Before Request]", pm.info.requestName, pm.request.method, requestUrl);
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // Berjalan otomatis setelah setiap respons.
      console.log("[After Response]", pm.info.requestName, "HTTP", pm.response.code);

      pm.test("Respons menggunakan JSON", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });

      // Simpan token otomatis setelah login sukses.
      if (pm.request.url.toString().includes("/api/login") && pm.response.code >= 200 && pm.response.code < 300) {
          try {
              const body = pm.response.json();
              if (body.data && body.data.token) {
                  pm.collectionVariables.set("token", body.data.token);
                  console.log("Token login disimpan ke collection variable.");
              }
          } catch (e) {
              console.warn("Respons login bukan JSON valid; token tidak disimpan.");
          }
      }
    language: text/javascript
