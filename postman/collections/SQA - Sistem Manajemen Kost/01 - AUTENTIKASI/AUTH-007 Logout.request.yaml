$kind: http-request
url: "{{base_url}}/logout"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout berhasil', function () { pm.response.to.have.status(200); });
      pm.collectionVariables.unset('token');
    language: text/javascript
order: 7000
