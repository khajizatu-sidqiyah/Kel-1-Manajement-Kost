$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "pemilik@gmail.com",
      "password": "pemilik1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login ditolak', function () { pm.expect(pm.response.code).to.be.oneOf([401, 422]); });
      pm.test('Tidak ada token login', function () { const b = pm.response.json(); pm.expect(b.data && b.data.access_token).to.not.exist; });
    language: text/javascript
examples: .resources/AUTH-002 Login password salah.resources/examples
order: 2000
