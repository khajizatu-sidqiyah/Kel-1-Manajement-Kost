$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "pemilik@gmail.com",
      "password": "password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login berhasil', function () { pm.response.to.have.status(200); });
      pm.test('Respons JSON', function () { pm.response.to.be.json; });
      const b = pm.response.json();
      pm.test('Struktur response login', function () { pm.expect(b).to.have.property('data'); pm.expect(b.data).to.have.property('token'); });
      if (b.data && b.data.token) { pm.collectionVariables.set('token', b.data.token); }
    language: text/javascript
examples: .resources/AUTH-001 Login pemilik berhasil.resources/examples
order: 1000
