$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "",
      "password": "password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Field kosong ditolak', function () { pm.response.to.have.status(422); });
    language: text/javascript
examples: .resources/AUTH-003 Login email kosong.resources/examples
order: 3000
