$kind: http-request
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "' OR '1'='1",
      "password": "' OR '1'='1"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('SQL injection tidak menghasilkan server error', function () { pm.expect(pm.response.code).not.to.eql(500); });
      pm.test('Tidak berhasil login tanpa kredensial valid', function () { pm.expect(pm.response.code).not.to.eql(200); });
    language: text/javascript
examples: .resources/AUTH-004 SQL Injection login.resources/examples
order: 4000
