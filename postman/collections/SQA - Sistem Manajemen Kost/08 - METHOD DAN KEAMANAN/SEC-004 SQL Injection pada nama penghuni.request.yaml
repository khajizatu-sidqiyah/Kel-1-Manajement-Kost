$kind: http-request
url: "{{base_url}}/penghuni"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nama_penghuni": "' OR '1'='1",
      "no_telepon": null,
      "email": null,
      "alamat": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tidak terjadi SQL server error', function () { pm.expect(pm.response.code).not.to.eql(500); });
      pm.test('Tidak membocorkan pesan SQL', function () { const t = pm.response.text().toLowerCase(); pm.expect(t).not.to.include('sql syntax'); pm.expect(t).not.to.include('mysql'); });
    language: text/javascript
order: 4000
