$kind: http-request
url: "{{base_url}}/pembayaran/{{id_pembayaran}}"
method: PUT
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_penghunian": 1,
      "jenis_pembayaran": "cicilan",
      "tanggal_bayar": "2026-11-10",
      "jumlah": 2000000,
      "metode_pembayaran": "transfer",
      "bukti_pembayaran": null
    }
scripts:
  - type: afterResponse
    code: pm.test('Update pembayaran sesuai kontrak', function () { pm.expect(pm.response.code).to.be.oneOf([200, 404, 422, 500]); });
    language: text/javascript
order: 8000
