$kind: http-request
url: "{{base_url}}/pembayaran"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_penghunian": 1,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 300000,
      "metode_pembayaran": "transfer",
      "bukti_pembayaran": null
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('DP berhasil dicatat', function () { pm.response.to.have.status(201); });
      const b = pm.response.json();
      if (b.data && b.data.id_pembayaran) pm.collectionVariables.set('id_pembayaran', String(b.data.id_pembayaran));
    language: text/javascript
order: 2000
