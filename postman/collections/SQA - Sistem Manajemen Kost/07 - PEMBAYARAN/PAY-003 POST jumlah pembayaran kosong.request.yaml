$kind: http-request
url: "{{base_url}}/pembayaran"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_penghunian": 1,
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-05",
      "metode_pembayaran": "transfer"
    }
scripts:
  - type: afterResponse
    code: pm.test('Jumlah wajib divalidasi', function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 3000
