$kind: http-request
url: "{{base_url}}/pembayaran"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_penghunian": 1,
      "jenis_pembayaran": "angsuran_aneh",
      "jumlah": 300000,
      "metode_pembayaran": "transfer"
    }
scripts:
  - type: afterResponse
    code: pm.test('Jenis pembayaran tidak valid ditolak', function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 5000
