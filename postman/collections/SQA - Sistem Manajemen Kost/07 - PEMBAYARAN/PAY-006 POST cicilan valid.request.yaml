$kind: http-request
url: "{{base_url}}/pembayaran"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_penghunian": 1,
      "jenis_pembayaran": "cicilan",
      "tanggal_bayar": "2026-11-10",
      "jumlah": 2000000,
      "metode_pembayaran": "transfer",
      "bukti_pembayaran": null
    }
scripts:
  - type: afterResponse
    code: pm.test('Cicilan berhasil dicatat', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 6000
