$kind: http-request
url: "{{base_url}}/penghunian/{{id_penghunian}}/dp"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "tanggal_bayar": "2026-11-05",
      "jumlah": 300000,
      "metode_pembayaran": "transfer"
    }
scripts:
  - type: afterResponse
    code: pm.test('Catat DP merespons sesuai kontrak', function () { pm.expect(pm.response.code).to.be.oneOf([201, 404, 422, 500]); });
    language: text/javascript
order: 10000
