$kind: http-request
url: "{{base_url}}/penghunian/{{id_penghunian}}/tenggat"
method: PUT
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "tenggat_pelunasan": "2027-01-05"
    }
scripts:
  - type: afterResponse
    code: pm.test('Tenggat berhasil diperbarui', function () { pm.expect(pm.response.code).to.be.oneOf([200, 404, 422, 500]); });
    language: text/javascript
order: 4000
