$kind: http-request
url: "{{base_url}}/penghuni"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nama_penghuni": "Rina Sari",
      "no_telepon": "081234567890",
      "email": "rina@example.com",
      "alamat": "Kuningan"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Penghuni berhasil dibuat', function () { pm.response.to.have.status(201); });
      const b = pm.response.json();
      if (b.data && b.data.id_penghuni) pm.collectionVariables.set('id_penghuni', String(b.data.id_penghuni));
    language: text/javascript
order: 2000
