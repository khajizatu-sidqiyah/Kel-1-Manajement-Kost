$kind: http-request
url: "{{base_url}}/penghuni"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nama_penghuni": "Sari",
      "no_telepon": null,
      "email": null,
      "alamat": null
    }
scripts:
  - type: afterResponse
    code: pm.test('Nomor HP nullable diterima', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 4000
