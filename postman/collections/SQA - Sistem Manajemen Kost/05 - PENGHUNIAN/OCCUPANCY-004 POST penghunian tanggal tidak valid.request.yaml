$kind: http-request
url: "{{base_url}}/penghunian"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_kamar": 1,
      "id_penghuni": 1,
      "tanggal_mulai": "2026-99-50"
    }
scripts:
  - type: afterResponse
    code: pm.test('Tanggal tidak valid ditolak', function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 4000
