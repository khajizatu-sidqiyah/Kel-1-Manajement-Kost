$kind: http-request
url: "{{base_url}}/penghunian"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "id_kamar": 1,
      "id_penghuni": 15,
      "tanggal_mulai": "2026-11-05",
      "tanggal_selesai": null,
      "penyewa_utama": true,
      "skema_sewa": "bulanan"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Penghunian berhasil dicatat', function () { pm.response.to.have.status(201); });
      const b = pm.response.json();
      if (b.data && b.data.id_penghunian) pm.collectionVariables.set('id_penghunian', String(b.data.id_penghunian));
    language: text/javascript
examples: .resources/OCCUPANCY-002 POST penghunian valid.resources/examples
order: 2000
