$kind: http-request
url: "{{base_url}}/kos"
method: PUT
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nama_kost": "Kost Melati",
      "alamat": "Jl. Melati No. 10",
      "deskripsi": "Kost nyaman dekat kampus",
      "fasilitas": "Wi-Fi, kamar mandi dalam"
    }
scripts:
  - type: afterResponse
    code: pm.test('Update kost sesuai kontrak', function () { pm.expect(pm.response.code).to.be.oneOf([200, 404, 422, 500]); });
    language: text/javascript
order: 2000
