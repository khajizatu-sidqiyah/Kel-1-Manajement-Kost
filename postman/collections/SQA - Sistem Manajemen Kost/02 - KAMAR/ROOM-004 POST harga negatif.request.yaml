$kind: http-request
url: "{{base_url}}/kamar"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: |-
    {
      "no_kamar": "98",
      "harga": -100000,
      "status": "kosong"
    }
scripts:
  - type: afterResponse
    code: pm.test('Harga negatif ditolak', function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 4000
