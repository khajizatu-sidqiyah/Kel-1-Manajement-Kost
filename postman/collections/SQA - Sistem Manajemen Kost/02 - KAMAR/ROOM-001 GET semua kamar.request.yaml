$kind: http-request
url: "{{base_url}}/kamar"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Daftar kamar berhasil', function () { pm.response.to.have.status(200); });
      pm.test('Data kamar berupa array', function () { pm.expect(pm.response.json().data).to.be.an('array'); });
    language: text/javascript
order: 1000
