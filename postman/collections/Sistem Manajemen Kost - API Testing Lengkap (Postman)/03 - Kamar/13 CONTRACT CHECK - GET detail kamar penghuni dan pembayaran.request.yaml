$kind: http-request
description: OpenAPI mengharapkan 200. Route belum ditemukan di routes/api.php; test ini sengaja akan FAIL pada backend saat ini sampai endpoint dibuat.
url: "{{base_url}}/kamar/{{kamar_id}}/detail"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status sesuai kontrak = 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time < 5000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
      pm.test("Tidak membocorkan detail internal", function () {
          const raw = pm.response.text().toLowerCase();
          ["sqlstate", "stack trace", "vendor/laravel"].forEach(x => pm.expect(raw).to.not.include(x));
      });
      if (pm.response.code >= 200 && pm.response.code < 300) {
          const j = pm.response.json();
          pm.test("Response sukses memiliki message dan data", function () {
              pm.expect(j).to.have.property("message");
              pm.expect(j).to.have.property("data");
          });
      }
    language: text/javascript
order: 13000
