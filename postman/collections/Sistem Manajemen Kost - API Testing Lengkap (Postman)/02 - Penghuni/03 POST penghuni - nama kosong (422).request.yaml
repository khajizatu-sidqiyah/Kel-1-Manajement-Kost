$kind: http-request
url: "{{base_url}}/penghuni"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nama_penghuni": "",
      "no_telepon": "081234567890",
      "email": "tata@gmail.com",
      "alamat": "Kuningan"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status = 422", function () {
          pm.response.to.have.status(422);
      });
      pm.test("Response time < 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Response bukan HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      pm.test("Tidak membocorkan error SQL/PHP", function () {
          const body = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server", "syntax error", "stack trace", "vendor/laravel"].forEach(x => {
              pm.expect(body).to.not.include(x);
          });
      });

      const j = pm.response.json();
      pm.expect(j).to.have.property("message");
      pm.expect(j).to.have.property("error");
    language: text/javascript
examples: .resources/03 POST penghuni - nama kosong (422).resources/examples
order: 3000
