$kind: http-request
url: "{{base_url}}/penghuni/15"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "nama_penghuni": "Postman QA Rina Updated",
      "no_telepon": "081234567891",
      "email": "ina@gmail.com",
      "alamat": "Cirebon"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status = 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time < 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Response bukan HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      pm.test("Tidak membocorkan error SQL/PHP", function () {
          const body = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server", "syntax error", "stack trace", "vendor/laravel"].forEach(x => {
              pm.expect(body).to.not.include(x);
          });
      });
      const j=pm.response.json(); pm.expect(j.data.nama_penghuni).to.eql("Postman QA Rina Updated");
    language: text/javascript
examples: .resources/12 PUT penghuni valid.resources/examples
order: 12000
