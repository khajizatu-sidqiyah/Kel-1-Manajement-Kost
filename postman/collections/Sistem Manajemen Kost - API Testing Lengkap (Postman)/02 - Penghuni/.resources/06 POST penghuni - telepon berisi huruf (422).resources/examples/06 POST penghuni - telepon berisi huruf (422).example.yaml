$kind: http-example
request:
  url: "{{base_url}}/penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "nama_penghuni": "tata",
        "no_telepon": "08123abc890",
        "email": "tata@gmail.com",
        "alamat": "Kuningan"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Tue, 03 Nov 2026 01:20:01 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Invalid request parameters.",
        "error": {
          "code": 422,
          "message": "Validation failed",
          "status": "INVALID_ARGUMENT",
          "details": {
            "no_telepon": [
              "The no telepon field must be a number.",
              "The no telepon field must be between 10 and 13 digits."
            ]
          }
        }
      }
order: 1000
