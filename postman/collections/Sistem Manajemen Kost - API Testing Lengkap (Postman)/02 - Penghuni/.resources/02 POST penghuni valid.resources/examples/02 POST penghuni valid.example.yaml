$kind: http-example
request:
  url: "{{base_url}}/penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "nama_penghuni": "Cici",
        "no_telepon": "081234567890",
        "email": "cici@gmail.com",
        "alamat": "Jogja"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Tue, 03 Nov 2026 01:17:03 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Penghuni berhasil ditambahkan.",
        "data": {
          "nama_penghuni": "Cici",
          "no_telepon": "081234567890",
          "email": "cici@gmail.com",
          "alamat": "Jogja",
          "updated_at": "2026-11-03T01:17:03.000000Z",
          "created_at": "2026-11-03T01:17:03.000000Z",
          "id_penghuni": 19
        }
      }
order: 1000
