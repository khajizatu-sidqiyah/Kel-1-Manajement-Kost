$kind: http-example
request:
  url: "{{base_url}}/penghuni"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: json
    content: |-
      {
        "nama_penghuni": "<script>alert('XSS')</script>",
        "no_telepon": "081234567890",
        "email": "xss@example.com",
        "alamat": "<img src=x onerror=alert(1)>"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Tue, 03 Nov 2026 01:24:15 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Penghuni berhasil ditambahkan.",
        "data": {
          "nama_penghuni": "<script>alert('XSS')</script>",
          "no_telepon": "081234567890",
          "email": "xss@example.com",
          "alamat": "<img src=x onerror=alert(1)>",
          "updated_at": "2026-11-03T01:24:15.000000Z",
          "created_at": "2026-11-03T01:24:15.000000Z",
          "id_penghuni": 21
        }
      }
order: 1000
