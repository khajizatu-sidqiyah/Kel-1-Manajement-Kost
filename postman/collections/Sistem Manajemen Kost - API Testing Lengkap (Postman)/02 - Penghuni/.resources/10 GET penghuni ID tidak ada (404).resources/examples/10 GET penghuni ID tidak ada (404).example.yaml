$kind: http-example
request:
  url: "{{base_url}}/penghuni/99999999"
  method: GET
  headers:
    Accept: application/json
    Authorization: Bearer {{token}}
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Host: 127.0.0.1:8000
    Connection: close
    X-Powered-By: PHP/8.2.12
    Cache-Control: no-cache, private
    Date: Tue, 03 Nov 2026 01:26:02 GMT
    Content-Type: application/json; charset=utf-8
    Access-Control-Allow-Origin: "*"
  body:
    type: json
    content: |-
      {
        "message": "Data penghuni tidak ditemukan.",
        "error": {
          "code": 404,
          "message": "Penghuni dengan ID 99999999 tidak ditemukan.",
          "status": "NOT_FOUND",
          "details": []
        }
      }
order: 1000
