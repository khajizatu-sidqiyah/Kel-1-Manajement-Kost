$kind: http-request
url: "{{base_url}}/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_penghunian": "{{id_penghunian}}",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 100000,
      "metode_pembayaran": "transfer",
      "bukti_pembayaran": "<script>alert(1)</script>"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status = 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response time < 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Response bukan HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      pm.test("Tidak membocorkan error SQL/PHP", function () {
          const body = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server", "syntax error", "stack trace", "vendor/laravel"].forEach(x => {
              pm.expect(body).to.not.include(x);
          });
      });

      const j=pm.response.json(); pm.expect(j.data.pembayaran.bukti_pembayaran).to.include("<script>");

      pm.test("Tidak ada SQL error / exception terpapar", function () {
        const b = pm.response.text().toLowerCase();
        ["sqlstate", "mysql", "syntax error", "exception", "stack trace"].forEach(x => pm.expect(b).to.not.include(x));
      });
    language: text/javascript
order: 9000
