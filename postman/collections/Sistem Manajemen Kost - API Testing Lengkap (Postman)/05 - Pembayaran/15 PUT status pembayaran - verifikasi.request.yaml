$kind: http-request
url: "{{base_url}}/pembayaran/{{id_pembayaran}}/status"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "status": "terverifikasi"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status = 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time < 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Response bukan HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      pm.test("Tidak membocorkan error SQL/PHP", function () {
          const body = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server", "syntax error", "stack trace", "vendor/laravel"].forEach(x => {
              pm.expect(body).to.not.include(x);
          });
      });

      const j=pm.response.json(); pm.expect(j.data.pembayaran.status).to.eql("terverifikasi");
      pm.expect(j.data).to.have.property("total_terbayar");
      pm.expect(j.data).to.have.property("sisa_tagihan");
    language: text/javascript
order: 15000
