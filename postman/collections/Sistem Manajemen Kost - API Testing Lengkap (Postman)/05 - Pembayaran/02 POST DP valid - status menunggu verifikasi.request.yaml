$kind: http-request
url: "{{base_url}}/pembayaran"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: json
  content: |-
    {
      "id_penghunian": "13",
      "penyewa_utama": "Postman QA Rina Updated",
      "jenis_pembayaran": "dp",
      "tanggal_bayar": "2026-11-05",
      "jumlah": 300000,
      "metode_pembayaran": "transfer",
      "bukti_pembayaran": "bukti-dp-qa.jpg"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status = 201", function () {
          pm.response.to.have.status(201);
      });
      pm.test("Response time < 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Response bukan HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      pm.test("Tidak membocorkan error SQL/PHP", function () {
          const body = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server", "syntax error", "stack trace", "vendor/laravel"].forEach(x => {
              pm.expect(body).to.not.include(x);
          });
      });

      const j=pm.response.json(); pm.expect(j.data.pembayaran).to.exist;
      pm.expect(j.data.pembayaran.status).to.eql("menunggu_verifikasi");
      pm.environment.set("id_pembayaran",j.data.pembayaran.id_pembayaran);
    language: text/javascript
order: 2000
