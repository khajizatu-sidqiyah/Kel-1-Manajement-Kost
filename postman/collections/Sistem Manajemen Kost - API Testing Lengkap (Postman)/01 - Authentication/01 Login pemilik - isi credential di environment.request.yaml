$kind: http-request
description: Isi owner_email dan owner_password pada environment. Token disimpan otomatis.
url: "{{base_url}}/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "pemilik@gmail.com",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP status = 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response time < 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });
      pm.test("Response bukan HTML", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      pm.test("Tidak membocorkan error SQL/PHP", function () {
          const body = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server", "syntax error", "stack trace", "vendor/laravel"].forEach(x => {
              pm.expect(body).to.not.include(x);
          });
      });

      const j = pm.response.json();
      pm.expect(j.data).to.have.property("token");
      pm.environment.set("token", j.data.token);
      pm.environment.set("role", j.data.user.role);
    language: text/javascript
examples: .resources/01 Login pemilik - isi credential di environment.resources/examples
order: 1000
