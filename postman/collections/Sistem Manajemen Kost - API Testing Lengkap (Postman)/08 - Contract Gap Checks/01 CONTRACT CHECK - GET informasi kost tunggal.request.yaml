$kind: http-request
description: OpenAPI mengharapkan 200; route GET /kos belum terdaftar di routes/api.php. Test ini harus FAIL pada backend saat ini sampai route/controller tersedia.
url: "{{base_url}}/kos"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("OpenAPI contract: GET /kos harus 200", function () { pm.response.to.have.status(200); });
      pm.test("Response time < 5000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(5000); });
      if (pm.response.code >= 200 && pm.response.code < 300) {
        const j = pm.response.json();
        pm.test("Wrapper message/data", function () { pm.expect(j).to.have.property("message"); pm.expect(j).to.have.property("data"); });
      }
    language: text/javascript
order: 1000
