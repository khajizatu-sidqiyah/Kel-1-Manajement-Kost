$kind: collection
description: Converted from project test scenarios. Base URL default local Laravel. Run login first. Check README notes for contract/backend method differences. Test only local/dev database.
variables:
  base_url: http://127.0.0.1:8000/api
  token: ""
  owner_email: pemilik@gmail.com
  owner_password: password123
  penghuni_id: "1"
  kamar_id: "1"
  penghunian_id: "1"
  pembayaran_id: "1"
scripts:
  - type: http:afterResponse
    code: |-
      pm.test("[GLOBAL] Response time < 5000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });
      pm.test("[GLOBAL] Response tidak membocorkan detail internal", function () {
          const raw = pm.response.text().toLowerCase();
          ["sqlstate", "mysql server has gone away", "syntax error", "stack trace", "vendor/laravel", "app/exceptions"].forEach(function (x) {
              pm.expect(raw, "Tidak boleh membocorkan: " + x).to.not.include(x);
          });
      });
      pm.test("[GLOBAL] Content-Type JSON untuk API response", function () {
          pm.expect(pm.response.headers.get("Content-Type") || "").to.include("application/json");
      });
      if (pm.response.code >= 200 && pm.response.code < 300) {
          pm.test("[CONTRACT] Success memiliki message dan data", function () {
              const j = pm.response.json();
              pm.expect(j).to.have.property("message");
              pm.expect(j).to.have.property("data");
              pm.expect(j).to.not.have.property("success");
          });
      } else if ([400,401,403,404,409,422,429,500].includes(pm.response.code)) {
          pm.test("[CONTRACT] Error memiliki message dan error object", function () {
              const j = pm.response.json();
              pm.expect(j).to.have.property("message");
              pm.expect(j).to.have.property("error");
              pm.expect(j.error).to.be.an("object");
          });
      }
    language: text/javascript
